<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
/* Some mobile browsers' "Desktop site" mode ignores width=device-width and
   substitutes a wide virtual viewport (e.g. ~980px), which shrinks this
   mobile-first layout. Force the viewport back to the real screen width. */
(function(){
  try{
    var realWidth = window.screen && window.screen.width;
    if (realWidth && realWidth > 0 && realWidth < 600) {
      var vp = document.querySelector('meta[name="viewport"]');
      if (vp) vp.setAttribute('content', 'width=' + realWidth + ', initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
    }
  }catch(e){}
})();
</script>
<title>Monster Research Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060B18; --surface:#0E1830; --surface2:#152444; --ink:#EAF3FF; --ink2:#7F94BE; --line:#213257;
  --lamp:#37C6F4; --lampink:#03131F; --moss:#37C6F4; --signal:#FF5C7A;
  --plate:#040914; --plateline:#2D4A78; --gold-hi:#9FE8FF;
  --home-img:url('assets/backgrounds/bg-bright.jpg');
  --display:"Orbitron","Segoe UI",system-ui,sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060B18; --surface:#0E1830; --surface2:#152444; --ink:#EAF3FF; --ink2:#7F94BE; --line:#213257;
    --lamp:#37C6F4; --lampink:#03131F; --moss:#37C6F4; --signal:#FF5C7A;
    --plate:#040914; --plateline:#2D4A78; --gold-hi:#9FE8FF;
  }
}
:root[data-theme="dark"]{
  --bg:#060B18; --surface:#0E1830; --surface2:#152444; --ink:#EAF3FF; --ink2:#7F94BE; --line:#213257;
  --lamp:#37C6F4; --lampink:#03131F; --moss:#37C6F4; --signal:#FF5C7A;
  --plate:#040914; --plateline:#2D4A78; --gold-hi:#9FE8FF;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:pan-x pan-y;overflow-x:hidden}
body{margin:0;min-height:100%;color:var(--ink);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden;
  background:
    radial-gradient(ellipse 140% 55% at 50% -12%,color-mix(in srgb,var(--lamp) 16%,transparent),transparent 62%),
    var(--bg)}
body.bg-home .app{
  background:
    linear-gradient(180deg,rgba(6,11,24,.12),rgba(6,11,24,.45) 60%,var(--bg) 92%),
    var(--home-img);
  background-size:100% auto,cover;
  background-position:top,center top;
  background-repeat:no-repeat,no-repeat}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 14px;zoom:var(--ui-scale,1)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
svg{display:block}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);
  background:linear-gradient(var(--bg) 82%,transparent);z-index:5;border-bottom:1px solid var(--line);margin-bottom:2px;max-width:100%}
.top h2{font:700 21px/1.15 var(--display);flex:1;letter-spacing:.01em;min-width:0;overflow:hidden;overflow-wrap:break-word}
.back{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.back svg{width:20px;height:20px}
.res{display:flex;gap:6px;flex:none}
@media (max-width:400px){
  .top h2{font-size:18px}
  .pill{padding:4px 9px 4px 7px;font-size:12.5px;gap:5px}
  .dot{width:14px;height:14px}
}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:5px 11px 5px 8px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.dot{width:16px;height:16px;flex:none;object-fit:contain;filter:drop-shadow(0 0 4px currentColor)}

/* status bar (home) */
.statusbar{display:flex;align-items:center;gap:6px;padding:8px 0 2px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.avwrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:4px 10px 4px 4px;flex:1;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--lamp) 55%,var(--surface2)),var(--surface2) 70%);
  border:2px solid var(--lamp);display:grid;place-items:center;color:var(--lamp);box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 45%,transparent)}
.av svg{width:14px;height:14px}
.avmeta{min-width:0;flex:1}
.avmeta b{display:block;font:700 11.5px/1.1 var(--display);letter-spacing:.02em}
.statusbar .pill{background:var(--surface2);padding:4px 9px 4px 6px;font-size:12px}
.plusbtn{width:18px;height:18px;border-radius:50%;background:var(--lamp);color:var(--lampink);display:grid;place-items:center;
  font:800 13px/1 var(--display);flex:none;margin-left:2px;box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 55%,transparent)}
.gear{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.gear svg{width:15px;height:15px;color:var(--ink2)}

/* home */
.heroRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0 7px}
.rankline{color:var(--lamp);font-weight:600;font-size:11.5px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.questchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;font-size:11.5px;font-weight:700;flex:none}
.questchip i{width:6px;height:6px;border-radius:50%;background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.questchip.ready{background:color-mix(in srgb,var(--lamp) 20%,var(--surface));color:var(--lamp);border-color:var(--lamp)}
.tube{position:relative;margin:0 0 8px;padding-top:58%;border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 100%,color-mix(in srgb,var(--lamp) 14%,var(--surface)),var(--bg) 78%),var(--surface);
  border:1px solid var(--line);box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.35)}
.tubein{position:absolute;inset:0;display:grid;place-items:center}
.cyl{position:relative;width:64%;height:92%;border-radius:40% 40% 46% 46%/16% 16% 22% 22%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--lamp) 22%,transparent),color-mix(in srgb,var(--lamp) 8%,transparent) 70%,transparent);
  border:2px solid color-mix(in srgb,var(--lamp) 65%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--lamp) 55%,transparent),inset 0 0 30px color-mix(in srgb,var(--lamp) 25%,transparent)}
.cyl::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(0deg,transparent 0 7px,color-mix(in srgb,var(--lamp) 10%,transparent) 7px 8px);opacity:.5}
.cyl .mon,.cyl .mon.img{position:absolute;left:3%;top:4%;width:94%;height:94%;z-index:2;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--lamp) 65%,transparent));animation:tubefloat 4s ease-in-out infinite}
@keyframes tubefloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6%) rotate(2deg)}}
.cylbase{position:absolute;left:50%;bottom:6%;width:56%;height:10%;transform:translateX(-50%);border-radius:50%;
  background:var(--plate);border:2px solid var(--plateline);box-shadow:0 0 20px color-mix(in srgb,var(--lamp) 40%,transparent)}
.tubetag{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;font-size:10px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px}
.tubetag i{width:5px;height:5px;border-radius:50%;background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.labart{height:auto;background:var(--surface)}
.labart .dish{transform-origin:142px 42px;animation:sway 6s ease-in-out infinite}
.labart .sig{animation:pulse 2.4s ease-out infinite;opacity:0}
.labart .sig2{animation-delay:.8s}
@keyframes sway{50%{transform:rotate(14deg)}}
@keyframes pulse{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.infocard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 14px;overflow:hidden}
.infocard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.ictop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.icname{font:700 16px/1.15 var(--display);letter-spacing:.01em}
.icbadges{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.icrar{font:700 10.5px var(--body);padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--lamp) 22%,var(--surface2));color:var(--lamp)}
.icel{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink2)}
.icel i{width:8px;height:8px;border-radius:50%}
.iclvl{font:600 11px var(--display);color:var(--ink2);margin-top:7px}
.homeAction{display:block;margin:0 0 8px}
.specCard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 11px;overflow:hidden}
.specCard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.scTop{display:flex;gap:10px;align-items:center}
.scThumb{position:relative;flex:none;width:50px;height:50px;border-radius:12px;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 100%,color-mix(in srgb,var(--lamp) 22%,var(--surface2)),var(--bg) 78%);
  border:2px solid color-mix(in srgb,var(--lamp) 55%,var(--line));box-shadow:0 0 14px color-mix(in srgb,var(--lamp) 30%,transparent)}
.scThumb .mon,.scThumb .mon.img{position:absolute;left:4%;top:6%;width:92%;height:92%}
.scMeta{flex:1;min-width:0}
.scNameRow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.scName{font:700 16px/1.15 var(--display);letter-spacing:.01em}
.scBadges{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.scRes{display:flex;align-items:center;gap:8px;margin-top:6px}
.scRes span{font:600 11px var(--display);color:var(--ink2);flex:none}
.scRes .bar{flex:1;margin:0}
.scDiv{height:1px;background:var(--line);margin:9px 0 7px}
.scBottom{display:flex;gap:8px;align-items:stretch}
.scStats{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.scStats .statrow{padding:2px 0;font-size:11.5px;border-top:0}
.scStats .statrow .si{width:13px;height:13px}
.scExplore{flex:none;width:92px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:800 12.5px/1.1 var(--display);letter-spacing:.02em;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--lamp) 55%,color-mix(in srgb,var(--lamp) 72%,black) 100%);
  color:var(--lampink);border:1px solid color-mix(in srgb,var(--lamp) 55%,black);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 color-mix(in srgb,var(--lamp) 45%,black),0 8px 16px rgba(0,0,0,.3)}
.scExplore svg{width:19px;height:19px}
.scExplore:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 color-mix(in srgb,var(--lamp) 45%,black),0 3px 8px rgba(0,0,0,.25)}
.stats{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;overflow:hidden}
.stats::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.big .n{font:700 46px/1 var(--display);letter-spacing:0;color:var(--ink);text-shadow:0 0 18px color-mix(in srgb,var(--lamp) 22%,transparent)}
.big .of{font:600 17px var(--display);color:var(--ink2);margin-left:5px}
.big .lb{display:block;color:var(--ink2);font-size:13px;margin-top:3px;letter-spacing:.02em}
.rs .rt{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.rs .rt b{font:700 18px var(--display);color:var(--lamp)}
.mini-res{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.statrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.statrow:first-of-type{border-top:0}
.statrow .si{color:var(--lamp);flex:none;width:14px;height:14px}
.statrow .sl{flex:1;color:var(--ink2);font-weight:600}
.statrow .sv{font-weight:700}
.cta.sm{min-height:40px;font-size:13px}
.menuWrap{position:relative;margin-top:12px}
.menu{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding:0 0 2px}
.menu::-webkit-scrollbar{display:none}
.gcard{flex:0 0 calc((100% - 18px) / 3);scroll-snap-align:start;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  text-align:left;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.25);aspect-ratio:1/1}
.menuArrow{position:absolute;top:42%;transform:translateY(-50%);z-index:4;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;color:#fff;background:rgba(6,11,24,.78);border:1px solid var(--plateline);
  box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 0 3px rgba(55,198,244,.12);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  transition:opacity .2s,transform .12s}
.menuArrow svg{width:16px;height:16px;pointer-events:none}
.menuArrow:active{transform:translateY(-50%) scale(.9)}
.menuArrow.prev{left:-6px}
.menuArrow.next{right:-6px;animation:menuNudge 1.6s ease-in-out 3}
.menuArrow[hidden]{display:none}
@keyframes menuNudge{0%,100%{transform:translateY(-50%) translateX(0)}50%{transform:translateY(-50%) translateX(3px)}}
.menuDots{display:flex;justify-content:center;gap:6px;margin-top:9px}
.menuDots i{width:6px;height:6px;border-radius:99px;background:var(--line);transition:width .2s,background .2s}
.menuDots i.on{width:18px;background:var(--lamp)}
.gbanner{position:absolute;inset:0;display:grid;place-items:center;color:#fff;overflow:hidden}
.gbanner svg{width:19px;height:19px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));position:relative;z-index:1}
.gbanner img{position:absolute;left:10%;top:6%;width:80%;height:68%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.gbody{position:relative;z-index:2;margin-top:auto;padding:26px 8px 8px;
  background:linear-gradient(to top,rgba(4,9,20,.95) 0%,rgba(4,9,20,.72) 45%,transparent 100%)}
.gt{font:700 10.5px/1.15 var(--display);letter-spacing:.02em;color:#fff}
.gs{font-size:9.5px;color:var(--ink2);margin-top:2px;line-height:1.2}
.gcard .chev{position:absolute;right:9px;bottom:9px;color:var(--ink2);opacity:.7;z-index:2}
.gcard .badge{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--lamp);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--lamp) 28%,transparent);z-index:2}
.questpanel{margin-top:16px}
.questpanel h3{font:700 15.5px/1 var(--display);padding:2px 0 10px}
.qrow{padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:5px}
.qtop .qr{color:var(--lamp);flex:none}
.qclaim{margin-top:7px;background:var(--lamp);color:var(--lampink);font-weight:700;padding:7px 14px;border-radius:99px;font-size:12.5px}

/* bars */
.bar{position:relative;height:9px;border-radius:99px;background:var(--surface2);margin:8px 0;
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s;
  background:linear-gradient(90deg,color-mix(in srgb,var(--moss) 75%,black),var(--moss))}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--surface);opacity:.9}
.bar.sm{height:6px;margin:4px 0 0}
.bar.sm b{display:none}

/* explore */
.locs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);min-height:118px;overflow:hidden}
.loc.sel{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp),0 0 16px color-mix(in srgb,var(--lamp) 30%,transparent)}
.loc .lic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:#fff;display:grid;place-items:center;
  box-shadow:inset 0 -2px 5px rgba(0,0,0,.3),inset 0 2px 2px rgba(255,255,255,.25)}
.loc .lic svg{width:20px;height:20px}
.loc .ln{font:700 16px/1.1 var(--display)}
.loc .lb{font-size:12.5px;color:var(--ink2);line-height:1.3}
.loc.locked{opacity:.68}
.loc.locked .lic{background:var(--surface2);color:var(--ink2)}

/* laboratory v2 */
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.permit{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:16px;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface2) 45%,var(--surface)));
  border:1.5px solid color-mix(in srgb,var(--tint) 42%,var(--line));min-height:150px}
.permit::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;pointer-events:none;
  background:radial-gradient(ellipse 90% 55% at 50% -10%,color-mix(in srgb,var(--tint) 30%,transparent),transparent 72%)}
.permit .lic{width:56px;height:56px;color:var(--tint);display:grid;place-items:center}
.permit .lic svg{width:19px;height:19px}
.permit .ln{font:700 15px/1.15 var(--display)}
.permit .lb{font-size:11.5px;color:var(--ink2);line-height:1.32;flex:1}
.permit.owned{border-color:color-mix(in srgb,var(--moss) 55%,var(--line))}
.permit .ownedtag{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font:700 10.5px var(--display);
  color:var(--moss);background:color-mix(in srgb,var(--moss) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--moss) 45%,var(--line));
  border-radius:99px;padding:3px 9px}
.permit .ownedtag svg{width:11px;height:11px}
.permit .buy{width:100%;justify-content:center;min-height:36px;font-size:12.5px;margin-top:auto}
.geargrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gear2{position:relative;display:flex;flex-direction:column;gap:7px;padding:14px 12px;border-radius:16px;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface2) 45%,var(--surface)));
  border:1.5px solid var(--line)}
.gear2::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.5;pointer-events:none;
  background:radial-gradient(ellipse 90% 55% at 50% -10%,color-mix(in srgb,var(--lamp) 24%,transparent),transparent 72%)}
.gear2 .gicon{width:56px;height:56px;display:grid;place-items:center;color:var(--lamp)}
.gear2 .gicon svg{width:19px;height:19px}
.gear2 .gn{font:700 14px/1.15 var(--display)}
.gear2 .gs{font-size:11px;color:var(--ink2);line-height:1.3;min-height:28px}
.gearpips{display:flex;gap:4px;margin:1px 0 2px}
.gearpips span{flex:1;height:6px;border-radius:99px;background:var(--surface2)}
.gearpips span.on{background:var(--lamp);box-shadow:0 0 6px color-mix(in srgb,var(--lamp) 60%,transparent)}
.gear2 .buy{width:100%;justify-content:center;min-height:36px;font-size:12.5px;margin-top:2px}
.energybar{display:flex;align-items:center;gap:9px;margin:6px 0 12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.energybar .eic{width:18px;height:18px;color:#FFD34D;flex:none;filter:drop-shadow(0 0 5px rgba(255,211,77,.55))}
.energybar .eic svg{width:18px;height:18px}
.energybar b{font:700 13.5px/1 var(--display);font-variant-numeric:tabular-nums;flex:none}
.energybar .etrack{flex:1;height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:0}
.energybar .etrack i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#FFB534,#FFE07A);transition:width .4s}
.energybar .esub{color:var(--ink2);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.gear2 .maxed{text-align:center;font:700 11px var(--display);letter-spacing:.03em;color:var(--lamp);padding:8px 0 2px}
.dock{position:sticky;bottom:0;margin:14px -16px 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 32%)}
.dockbackdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;animation:fadein .18s ease-out}
.dockpopup{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:480px;
  padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  animation:sheetup .22s cubic-bezier(.2,1,.3,1)}
@keyframes fadein{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(100%)}}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;
  border-radius:12px;font:700 17px/1 var(--display);letter-spacing:.02em;text-align:center;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--lamp) 55%,color-mix(in srgb,var(--lamp) 72%,black) 100%);
  color:var(--lampink);border:1px solid color-mix(in srgb,var(--lamp) 55%,black);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 color-mix(in srgb,var(--lamp) 45%,black),0 8px 16px rgba(0,0,0,.3)}
.cta.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.cta[aria-disabled="true"]{opacity:.5}
.cta:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 color-mix(in srgb,var(--lamp) 45%,black),0 3px 8px rgba(0,0,0,.25)}
.linkbtn{display:block;margin:12px auto 0;padding:8px 14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* plate */
.plate{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:6px auto 14px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--plateline) 22%,var(--plate)) 0%,var(--plate) 72%);
  border:4px solid var(--plateline);overflow:hidden;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--bg),0 14px 30px rgba(0,0,0,.4),inset 0 0 46px rgba(0,0,0,.55)}
.plate::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 30px,color-mix(in srgb,var(--gold-hi) 16%,transparent) 30px 31px)}
.sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg 285deg,color-mix(in srgb,var(--lamp) 65%,transparent) 360deg);
  animation:spin 3.2s linear infinite;mix-blend-mode:screen}
.plate.searching .sweep{animation-duration:1.1s}
.plate .mon{width:68%;height:68%;position:relative;z-index:2;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.plate .mon.img{position:absolute;left:9%;top:9%;width:82%;height:82%}
.plate::before{z-index:1}
.sweep{z-index:1}
.pbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;z-index:0;filter:saturate(.8) brightness(.7) sepia(.15)}
.plate.lost .mon{opacity:.35;transition:opacity .8s}
.plate.sm{width:min(40vw,150px);margin:4px auto 8px;border-width:3px}
.plate.sm .mon{width:66%;height:66%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.35);opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.mon{display:block;overflow:visible}
.sil{filter:brightness(0) invert(1) opacity(.18)}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}

.status{text-align:center;margin-bottom:12px}
.status h3{font:700 21px/1.2 var(--display);letter-spacing:.01em}
.status p{color:var(--ink2);margin-top:3px}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;background:var(--surface);
  border:1px solid color-mix(in srgb,var(--gc,var(--line)) 45%,var(--line));font-size:13px;font-weight:600;
  box-shadow:0 0 8px color-mix(in srgb,var(--gc,transparent) 35%,transparent)}
.tag i{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;flex:none}
.tag i svg{width:10px;height:10px}
.pips{display:flex;justify-content:center;gap:8px;margin:2px 0 6px}
.pips span{width:26px;height:8px;border-radius:99px;background:var(--surface2)}
.pips span.on{background:var(--lamp)}
.pipcap{text-align:center;font-size:13px;color:var(--ink2)}
.gauge{position:relative;height:34px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 12px;border:1px solid var(--line)}
.gauge .z{position:absolute;top:0;bottom:0;left:var(--l);width:var(--w);background:color-mix(in srgb,var(--moss) 60%,transparent)}
.gauge .z.p{background:var(--lamp)}
.needle{position:absolute;top:-2px;bottom:-2px;left:0;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--ink)}
.result{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;animation:rise .3s ease-out;overflow:hidden}
.result::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.result h3{font:700 18px/1.15 var(--display)}
.result.miss{border-color:color-mix(in srgb,var(--signal) 55%,var(--line))}
.result.miss::before{background:linear-gradient(90deg,transparent,var(--signal),transparent)}
.result.miss h3{color:var(--signal)}
.result.miss .note{color:var(--ink2);margin-top:4px}
.result .rl{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:10px 0 0}
.chips li{background:var(--surface2);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.chips li.hl{background:var(--lamp);color:var(--lampink);box-shadow:0 0 10px color-mix(in srgb,var(--lamp) 55%,transparent)}
.winOverlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(4,8,18,.74);backdrop-filter:blur(3px);animation:fadein .22s ease-out}
.winOverlay .result.win{width:100%;max-width:360px;margin:0;animation:winCardIn .45s cubic-bezier(.2,1.5,.4,1) both}
.winOverlay .dock{position:static;margin:16px 0 0;padding:0;background:none}
@keyframes winCardIn{0%{transform:scale(.78) translateY(14px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.result.win{text-align:center;padding:22px 16px 18px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold-hi) 16%,var(--surface)),var(--surface));
  border-color:color-mix(in srgb,var(--gold-hi) 55%,var(--line));
  box-shadow:0 0 34px color-mix(in srgb,var(--gold-hi) 32%,transparent),inset 0 1px 0 rgba(255,255,255,.06)}
.result.win::before{background:linear-gradient(90deg,transparent,var(--gold-hi),transparent)}
.resultBurst{position:absolute;inset:-30% -20% auto -20%;height:180%;pointer-events:none;z-index:0;
  background:conic-gradient(from 0deg,color-mix(in srgb,var(--gold-hi) 18%,transparent) 0deg 6deg,transparent 6deg 22deg);
  opacity:.6;animation:burstSpin 10s linear infinite}
@keyframes burstSpin{to{transform:rotate(360deg)}}
.resultSpark{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.resultTitle{position:relative;z-index:1;font:800 27px/1.1 var(--display);letter-spacing:.02em;
  background:linear-gradient(180deg,#FFF6C2,var(--gold-hi));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px color-mix(in srgb,var(--gold-hi) 50%,transparent));
  animation:titlePop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes titlePop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16);opacity:1}100%{transform:scale(1)}}
.resultSub{position:relative;z-index:1;color:var(--ink2);font-weight:600;font-size:13px;margin-top:3px}
.rewardRow{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;margin-top:16px}
.rewardChip{display:flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid color-mix(in srgb,var(--gold-hi) 40%,var(--line));border-radius:99px;padding:7px 16px 7px 12px;
  font:800 16px/1 var(--display);font-variant-numeric:tabular-nums;animation:chipPop .4s cubic-bezier(.2,1.6,.4,1) both}
.rewardChip:nth-child(2){animation-delay:.12s}
.rewardChip img{width:19px;height:19px;filter:drop-shadow(0 0 4px currentColor)}
@keyframes chipPop{0%{transform:scale(.5) translateY(6px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.hint{color:var(--ink2);font-size:14px;text-align:center;margin-top:10px}

/* database */
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;padding:7px 13px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13.5px;border:1px solid transparent}
.fc.on{background:var(--lamp);color:var(--lampink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:var(--surface);
  border:1.5px solid color-mix(in srgb,var(--rc,var(--line)) 55%,var(--line));overflow:hidden}
.tile::before{content:"";position:absolute;inset:0;z-index:0;opacity:.5;pointer-events:none;
  background:radial-gradient(ellipse 90% 55% at 50% -10%,color-mix(in srgb,var(--rc,transparent) 30%,transparent),transparent 72%)}
.tile>*{position:relative;z-index:1}
.tile .mini{position:relative;flex:none;width:100%;height:0;padding-bottom:100%;border-radius:50%;background:var(--plate);
  overflow:hidden;margin-bottom:2px;border:2px solid color-mix(in srgb,var(--rc,var(--plateline)) 65%,var(--plateline));
  box-shadow:0 0 14px color-mix(in srgb,var(--rc,transparent) 40%,transparent)}
.tile .mini .mon{position:absolute;left:10%;top:10%;width:80%;height:80%}
.tn{font:700 15.5px/1.1 var(--display)}
.tr{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--rc,var(--ink2));font-weight:600}
.tr i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 6px currentColor}
.tile.unk{--rc:var(--line)}
.tile.unk .tn{color:var(--ink2)}
.count{color:var(--ink2);font-size:14px;margin:0 0 10px}

/* inventory */
.invstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 14px}
.ivcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 6px 9px;
  text-align:center;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ivcard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--lamp),transparent);opacity:.7}
.ivcard b{display:block;font:800 21px/1.1 var(--display);color:var(--lamp)}
.ivcard span{font-size:10px;color:var(--ink2);display:block;margin-top:3px;letter-spacing:.01em}
.lootgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding-bottom:4px}
.invhead{font:700 15px/1.1 var(--display);margin:4px 0 8px}
.invhead:not(:first-child){margin-top:14px}
.loot{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px 4px 8px;border-radius:13px;min-width:0;
  text-align:center;isolation:isolate;overflow:hidden;
  background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface2) 50%,var(--surface)));
  border:1px solid color-mix(in srgb,var(--rc,var(--lamp)) 42%,var(--line))}
.loot.zero{opacity:.45}
.loot.food{cursor:pointer;transition:transform .12s}
.loot.food:active{transform:scale(.95)}
.loot::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.6;pointer-events:none;
  background:radial-gradient(ellipse 90% 60% at 50% -8%,color-mix(in srgb,var(--rc,var(--lamp)) 28%,transparent),transparent 70%)}
.lootqty{position:absolute;right:4px;top:4px;background:var(--plate);border:1px solid color-mix(in srgb,var(--rc,var(--lamp)) 55%,var(--plateline));
  color:var(--ink);font:700 9.5px/1 var(--display);padding:3px 6px;border-radius:99px;box-shadow:0 0 6px color-mix(in srgb,var(--rc,var(--lamp)) 30%,transparent)}
.lootico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--rc,var(--lamp));margin-top:0;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc,var(--lamp)) 45%,var(--surface2)),var(--surface2) 72%);
  border:1.5px solid color-mix(in srgb,var(--rc,var(--lamp)) 68%,var(--line));
  box-shadow:0 0 8px color-mix(in srgb,var(--rc,var(--lamp)) 50%,transparent)}
.lootico svg{width:17px;height:17px}
.loot.food .lootico{width:46px;height:46px;border:0;background:none;box-shadow:none}
.itemimg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.itemfb{display:grid;place-items:center;width:100%;height:100%}
.itemfb[hidden],.itemimg[hidden]{display:none}
.feedbtn .fi{width:30px;height:30px}
.potbtn .pi{width:22px;height:22px;display:block}
.loot b{font:700 11px/1.15 var(--display);word-break:break-word;max-width:100%;padding:0 2px}
.lootsrc{font-size:9px;line-height:1.15;color:var(--ink2);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lootrar{font:700 8px/1 var(--display);letter-spacing:.04em;color:var(--rc,var(--lamp));
  background:color-mix(in srgb,var(--rc,var(--lamp)) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--rc,var(--lamp)) 45%,var(--line));
  border-radius:99px;padding:2px 6px;margin-top:1px}
.lootempty{text-align:center;padding:34px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.lootempty svg{width:30px;height:30px;color:var(--ink2);margin:0 auto 8px}
.lootempty p{color:var(--ink2);font-size:14px}

/* detail */
.dhead{text-align:center}
.dhead h3{font:700 19px/1.15 var(--display);letter-spacing:.01em}
.forms{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:9px 0 4px}
.form{padding:5px 12px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13.5px}
.form.on{background:var(--lamp);color:var(--lampink)}
.form.unk{background:transparent;border:1px dashed var(--line);color:var(--ink2)}
.panel{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px 10px;margin-top:14px;overflow:hidden}
.panel::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.panel h3{font:700 17px/1 var(--display);padding:12px 0 4px}
.frow{display:grid;grid-template-columns:112px 1fr;gap:8px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.frow:first-of-type{border-top:0}
.fl{font-weight:700;display:flex;gap:6px;align-items:flex-start;font-size:14.5px;line-height:1.25}
.fl i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);display:block;flex:none}
.fl.ok i{background:var(--moss);border-color:var(--moss)}
.redact{height:14px;border-radius:5px;margin-top:3px;background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--line) 6px 12px)}
.redcap{font-size:13px;color:var(--ink2);margin-top:5px}
.statgrid{display:flex;flex-direction:column;gap:8px;padding:10px 0 12px}
.bpickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bpick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 6px 10px;text-align:center}
.bpick .mon,.bpick .mon.img{position:relative;width:52px;height:52px;margin:0 auto}
.bpick b{display:block;font-size:11.5px;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bpick .bmeta{display:block;font-size:10.5px;color:var(--ink2);margin-top:1px}
.durmini{display:block;height:4px;border-radius:99px;background:var(--surface2);margin:5px 6px 0;overflow:hidden}
.durmini i{display:block;height:100%;border-radius:inherit;background:#5fd08a}
.bpick.hungry .durmini i{background:var(--signal)}
.bpinfo{margin:0 0 8px;font-size:12.5px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}
.bpinfo b{color:var(--ink)}.bpinfo span{flex-basis:100%;font-size:11px}
.feedrow{display:flex;gap:8px;margin:0 0 10px}
.feedbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.feedbtn b{font-size:12.5px}.feedbtn span{font-size:10.5px;color:var(--ink2)}
.feedbtn[aria-disabled="true"]{opacity:.5}
.trainline{position:relative;z-index:1;margin:12px 0 0;font-size:12px;color:var(--ink2);text-align:center;line-height:1.5}
.trainline .lvup{color:var(--lamp);font-weight:800}
.geargrid.three{grid-template-columns:repeat(3,1fr);gap:8px}
.geargrid.three .gear2{padding:12px 9px}
.geargrid.three .gs{font-size:10.5px;min-height:0}
.geargrid.three .gn{font-size:12.5px}
.bpick.sel{border-color:var(--lamp);box-shadow:0 0 0 2px color-mix(in srgb,var(--lamp) 45%,transparent),0 0 12px color-mix(in srgb,var(--lamp) 35%,transparent)}
.hprow{display:flex;gap:8px;margin-top:10px}
.hpcard{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 9px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.hpcard.foe{text-align:right}
.hptop{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.hpcard.foe .hptop{flex-direction:row-reverse}
.hpcard b{font:700 13px/1.2 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hpcard .blv{color:var(--ink2);font-weight:600;font-size:11px;flex:none}
.bhpwrap{margin-top:5px}
.bhpbar{height:9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bhpbar i{display:block;height:100%;border-radius:inherit;transition:width .35s}
.bhptxt{display:block;margin-top:3px;font:700 11px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink2)}
.hpcard.foe .bhptxt{text-align:right}
.bstawrap{margin-top:4px}
.bstabar{height:6px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bstabar i{display:block;height:100%;border-radius:inherit;background:#3B82D6;transition:width .35s}
.bstatxt{display:block;margin-top:2px;font:700 9.5px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink2)}
.hpcard.foe .bstatxt{text-align:right}
.arena{position:relative;margin:10px 0 4px;height:clamp(190px,32vh,280px);border-radius:18px;overflow:hidden;
  border:1px solid var(--line);
  background:
    radial-gradient(ellipse 60% 46% at 18% 88%,color-mix(in srgb,var(--lamp) 22%,transparent),transparent 72%),
    radial-gradient(ellipse 60% 46% at 82% 88%,color-mix(in srgb,var(--signal) 18%,transparent),transparent 72%),
    linear-gradient(180deg,rgba(10,12,20,.35),rgba(10,12,20,.55) 78%),
    url('assets/backgrounds/arena.webp');
  background-size:cover;background-position:center}
.arena::before{content:"";position:absolute;left:0;right:0;bottom:10%;height:1px;

/* dungeon */

@keyframes healPulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.25);opacity:0}}
/* ATTACKER: winds up, then dashes at the target (cyan glow), then slides back. */

@keyframes atkR{0%{transform:translateX(0) scale(1)}35%{transform:translateX(-9%) scale(.94)}100%{transform:translateX(48%) scale(1.07)}}

@keyframes backR{0%{transform:translateX(48%) scale(1.07)}100%{transform:translateX(0) scale(1)}}
@keyframes backL{0%{transform:translateX(-48%) scale(1.07)}100%{transform:translateX(0) scale(1)}}
/* DEFENDER: only the one being hit gets knocked back, shakes, flashes red and shows an impact burst. */

@keyframes hitMe{0%{transform:translateX(0) rotate(0)}14%{transform:translateX(-20%) rotate(-5deg)}30%{transform:translateX(-11%) rotate(2deg)}46%{transform:translateX(-16%) rotate(-3deg)}68%{transform:translateX(-4%) rotate(1deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes hitFoe{0%{transform:translateX(0) rotate(0)}14%{transform:translateX(20%) rotate(5deg)}30%{transform:translateX(11%) rotate(-2deg)}46%{transform:translateX(16%) rotate(3deg)}68%{transform:translateX(4%) rotate(-1deg)}100%{transform:translateX(0) rotate(0)}}
.arenaFighter.hit .mon,.arenaFighter.hit .mon.img{animation:hitFlash .55s ease-in-out}
@keyframes hitFlash{0%,100%{filter:none}18%,52%{filter:drop-shadow(0 0 12px var(--signal)) brightness(2.1) saturate(.4)}35%{filter:drop-shadow(0 0 8px var(--signal)) brightness(1.2)}}
.impact{position:absolute;left:50%;top:50%;width:80%;aspect-ratio:1;margin:-40% 0 0 -40%;border-radius:50%;pointer-events:none;z-index:3;

.dmgpop{position:absolute;left:50%;top:2%;transform:translateX(-50%);font:800 22px/1 var(--display);

@keyframes dmgFloat{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.2)}70%{opacity:1;transform:translate(-50%,-22px) scale(1)}100%{opacity:0;transform:translate(-50%,-38px) scale(.9)}}
.arenaLog{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;max-height:58px;overflow-y:auto;z-index:3;

 /* no text selection / web-search popup on long-press; taps on the wallet pills bounce instead */

<script>
/* Fills whatever layout viewport width the browser reports — including a
   "fake" wide one from a mobile browser's Desktop Site mode — by zooming
   the #app box up to exactly match window.innerWidth. The browser then
   auto-zooms the whole page back down to fit the real screen, and since
   our box now fills the (fake) layout viewport edge-to-edge, that
   auto-zoom lands it back at the correct real-world size. This works
   regardless of what width the browser fakes, and doesn't rely on
   screen.width (some browsers fake that too).
   Uses CSS zoom rather than transform:scale() — zoom actually affects
   layout size (so no manual height bookkeeping is needed) and, unlike
   transform, it doesn't break position:sticky/fixed on children.
   On a real desktop with a mouse, this is a no-op: pointer:coarse is
   false there, so the normal responsive max-width:480px card layout is
   left alone. */
(function(){
  if(!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) return;
  var appEl = document.getElementById('app');
  var APP_MAX_W = 480; // must match .app{max-width:480px} in the CSS above
  var lastScale = -1;
  var lastWidth = -1;
  function applyScale(){
    var iw = window.innerWidth;
    /* Chrome's address bar / scrollbar overlay can nudge innerWidth by a
       stray pixel or two purely from scrolling — ignore sub-3px noise so a
       plain scroll never re-triggers this at all. */
    if (lastWidth !== -1 && Math.abs(iw - lastWidth) < 3) return;
    lastWidth = iw;
    /* naturalW is computed purely from the known CSS max-width, never by
       reading the live (already-zoomed) element. Reading the element and
       working backwards from whatever scale we last applied compounds any
       one-off bad reading forever, with nothing to re-anchor it — that's
       what caused the zoom to get stuck too large after scrolling. Pure
       math has no state to drift. */
    var naturalW = Math.min(APP_MAX_W, iw);
    var scale = iw / naturalW;
    if(!isFinite(scale) || scale <= 0) scale = 1;
    scale = Math.max(0.5, Math.min(scale, 3));
    if (lastScale !== -1 && Math.abs(scale - lastScale) < 0.01) return; // no meaningful change
    lastScale = scale;
    appEl.style.setProperty('--ui-scale', scale);
  }
  applyScale();
  window.addEventListener('resize', applyScale);
  window.addEventListener('orientationchange', applyScale);
  window.addEventListener('load', applyScale);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', applyScale);
  /* NOTE: intentionally NOT using a ResizeObserver on #app here. #app is the
     very element whose "zoom" we set, so observing its own box triggers this
     callback again every time we change the zoom (and switching screens
     changes its HEIGHT, e.g. the tall research tree view, even though scale
     only ever depends on WIDTH). That self-observe + self-mutate loop is
     what caused the "zooms by itself" glitch when opening bigger screens
     like Research. The width-driven listeners above are the only triggers
     the scale actually needs. */
})();

const TRAIN = {maxDur:100, durCost:[6,8,11,13,19,25], capMult:1.5, loseXp:.3, loseCoin:.25, xpBase:14, xpPerLv:3, needBase:40, needPerLv:15};

/* Battle coins are paid in full for the first `full` battles each day, then multiplied by `dim`. XP is never reduced. */
const BATTLE_DAILY = {full:12, dim:.5};
const BATTLE_COIN = [16, 18, 22, 28, 34, 40];
const battleCoins = (foe) => Math.round(BATTLE_COIN[foe.r] * (1 + foe.lv * .006));
const monLv = (rec) => rec.lv != null ? rec.lv : rec.lvMax;
const durOf = (rec) => rec.dur != null ? rec.dur : TRAIN.maxDur;
const durCost = (sp) => Math.max(1, Math.round(TRAIN.durCost[sp.r] * (1 - .15 * ((S.tech.combat >= 2) + (S.tech.combat >= 4)))));
const xpNeed = (lv) => TRAIN.needBase + lv * TRAIN.needPerLv;
const capOf = (sp) => Math.ceil(sp.lv[1] * TRAIN.capMult);
function applyTraining(rec, sp, foe, win) {
  const lvFrom = monLv(rec), cap = capOf(sp);
  if (lvFrom >= cap) return {xp:0, lvFrom, lvTo:lvFrom, capped:true};
  const ratio = Math.max(.4, Math.min(1.6, foe.lv / Math.max(1, lvFrom)));
  let gain = Math.round((TRAIN.xpBase + foe.lv * TRAIN.xpPerLv) * ratio * (1 + foe.r * .1));
  gain = Math.round(gain * (1 + .25 * ((S.tech.combat >= 1) + (S.tech.combat >= 3))));
  if (!win) gain = Math.round(gain * TRAIN.loseXp);
  let lv = lvFrom, xp = (rec.xp || 0) + gain;
  while (lv < cap && xp >= xpNeed(lv)) { xp -= xpNeed(lv); lv++; }
  if (lv >= cap) xp = 0;
  rec.lv = lv; rec.xp = xp; rec.lvMax = Math.max(rec.lvMax, lv);
  return {xp:gain, lvFrom, lvTo:lv, capped:lv >= cap};
}
function feedRow(id) {
  const rec = S.sp[id], full = durOf(rec) >= TRAIN.maxDur;
  return `<div class="feedrow">${Object.keys(FOOD).map(k => `<button class="feedbtn" data-act="feed" data-id="${id}" data-food="${k}" aria-disabled="${S.food[k] <= 0 || full}"><span class="fi">${itemIcon('food_' + k, 'food')}</span><b>${FOOD[k].short}</b><span>+${FOOD[k].dur} · ×${S.food[k]}</span></button>`).join('')}</div>`;
}
function trainHtml(b) {
  const t = b.train, parts = [];
  if (t) {
    if (t.lvTo > t.lvFrom) parts.push(`<span class="lvup">Level up! Lv. ${t.lvFrom} → ${t.lvTo}</span>`);
    if (t.xp) parts.push(`+${num(t.xp)} XP`); else if (t.capped) parts.push('Max level for this species');
  }
  if (b.consolation) parts.push(`+${num(b.consolation)} coins`);
  if (b.dimmed) parts.push('Daily coin bonus used up: coins halved');
  if (b.durCost) parts.push(`Durability −${b.durCost} (${b.durLeft}/${TRAIN.maxDur} left)`);
  return `<p class="trainline">${parts.join(' · ')}</p>`;
}

function todayStr() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function pickQuests(seedStr) {
  let seed = 0; for (const c of seedStr) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed * 1103515245 + 12345) >>> 0; return seed / 4294967295; };
  const pool = QUEST_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1));[pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, 3).map(q => ({id: q.id, claimed: false}));
}
function ensureDaily() {
  const t = todayStr();
  if (!S.daily || S.daily.date !== t) {
    S.daily = {date: t, scans: 0, perfect: 0, trips: 0, coins: 0, newsp: 0, battles: 0};
    S.quests = {date: t, list: pickQuests(t)};
    save();
  }
}
function questProgress(qid) { const Q = QUEST_POOL.find(x => x.id === qid); return {Q, val: Math.min(S.daily[Q.key] || 0, Q.goal)}; }
function partnerPct() {
  if (!S.partner || !isOwned(S.partner)) return 0;
  const sp = SP(S.partner), rec = S.sp[S.partner];
  return Math.round((sp.r + 1) * 3 * (rec.mastered ? 1.5 : 1));
}

function pickOpponent(excludeId, lv, r) {

function battleMoveDmg(atkF, defF, move) {

function battleStep(order, i) {

    else if (b.e.hp <= 0 && !b.over) finishBattle(true);
    b.busy = false; b.anim = null; render(); scrollBlog();
    return;
  }
  if (i >= order.length) {
    b.p.stamina = Math.min(b.p.maxStamina, b.p.stamina + STA_REGEN);
    b.e.stamina = Math.min(b.e.maxStamina, b.e.stamina + STA_REGEN);

      const pPct = b.p.hp / b.p.maxHp, ePct = b.e.hp / b.e.maxHp;

    return;

    const got = b.p.hp - before;
    b.log.push(`Turn ${b.turn}: ${SP(b.p.id).name} used ${P.n}: +${got} HP`);
    b.rageFx = false; b.anim = {side: 'p', phase: 'heal', amt: got};

    return;

  b.rageFx = false; b.anim = {side: who, phase: 'wind'};
  render(); scrollBlog();

    const bb = ui.battle; if (!bb) return;
    const atkF = who === 'p' ? bb.p : bb.e, defF = who === 'p' ? bb.e : bb.p;
    const atkName = SP(atkF.id).name;
    if (atkF.hp <= 0) { setTimeout(() => battleStep(order, i + 1), 0); return; }
    atkF.stamina = Math.max(0, atkF.stamina - MOVES[mv].cost);

    render(); scrollBlog();
    setTimeout(() => battleStep(order, i + 1), 850);

function viewEncounter() {
  const e = ui.enc, L = LOC(e.loc);
  const chargesLeft = e.charges;
  let plate = '', status = '', controls = '';
  if (e.phase === 'searching') {
    plate = `<div class="plate searching">${plateBg(e.loc)}<div class="sweep"></div></div>`;
    status = `<h3>Scanning the area</h3><p>Sweeping the ${L.n.toLowerCase()} for signals.</p>`;
  } else if (e.phase === 'nothing') {
    plate = `<div class="plate">${plateBg(e.loc)}<div class="sweep"></div></div>`;
    status = `<h3>Only static</h3><p>No signal this time. Try again.</p>`;
    controls = `<div class="dock"><button class="cta" data-act="explore" aria-disabled="${S.energy < energyCost(e.loc)}">Explore ${L.n} again · −${energyCost(e.loc)} Energy</button><button class="linkbtn" data-act="leave">Change area</button></div>`;
  } else {
    const sp = e.sp;
    plate = `<div class="plate${e.phase === 'done' ? ' lost' : ''}">${plateBg(e.loc)}${e.phase === 'found' ? '<div class="sweep"></div>' : ''}${monSVG(sp, e.form)}</div>`;
    if (e.known) {
      status = `<h3>${esc(formName(sp, e.form))}</h3><div class="meta">${elTag(sp.el)}${rarTag(sp.r)}<span class="tag">Lv. ${e.lv}</span>${threatLabel(e.pen) ? `<span class="tag" style="--gc:#FF5C7A">▲ ${threatLabel(e.pen)}</span>` : ''}</div>`;
    } else {
      status = `<h3>A monster has been detected!</h3><p>Unidentified creature. Scan it to learn more.</p>`;
    }
    const pips = `<div class="pips" aria-label="${chargesLeft} scans left">${Array.from({length: maxCharges()}, (_, i) => i).map(i => `<span class="${i < chargesLeft ? 'on' : ''}"></span>`).join('')}</div>`;
    if (e.phase === 'found') {
      const z = e.zone, pl = (z.c - z.w * .2) * 100, pw = z.w * .4 * 100;
      controls = `${pips}<p class="pipcap">${chargesLeft} ${chargesLeft === 1 ? 'scan' : 'scans'} left before the signal fades</p>
        <div class="gauge" aria-hidden="true"><div class="z" style="--l:${((z.c - z.w / 2) * 100).toFixed(1)}%;--w:${(z.w * 100).toFixed(1)}%"></div><div class="z p" style="--l:${pl.toFixed(1)}%;--w:${pw.toFixed(1)}%"></div><div class="needle" id="needle"></div></div>
        <button class="cta" data-act="scan">Scan</button><button class="linkbtn" data-act="leave">Leave</button>`;
    } else {
      controls = `<p class="hint">${e.fled ? 'The reading spiked, then vanished — it bolted!' : 'Signal lost. The monster slipped away.'}</p>
        <div class="dock"><button class="cta" data-act="explore" aria-disabled="${S.energy < energyCost(e.loc)}">Explore ${L.n} again · −${energyCost(e.loc)} Energy</button><button class="linkbtn" data-act="leave">Change area</button></div>`;
    }
  }
  let result = '';
  if (e.last && e.last.miss) {
    result = `<section class="result miss" aria-live="polite"><h3>${e.last.title}</h3>
      <p class="note">The needle swung wide — no data captured. ${e.phase === 'found' ? 'It got jumpier; time it better.' : ''}</p></section>`;
  } else if (e.last) {
    const r = e.last, sp = e.sp;
    const chips = [`<li>Coins +${num(r.coins)}</li>`, `<li>Data +${num(r.dp)}</li>`];
    if (r.drop) chips.push(`<li>${r.drop.isNew ? 'New drop' : 'Drop'}: ${esc(r.drop.name)}</li>`);
    if (r.first) chips.push(`<li class="hl">New discovery</li>`);
    if (r.newForm) chips.push(`<li class="hl">New form logged: ${esc(formName(sp, e.form))}</li>`);
    r.facets.forEach(f => { if (!(r.first && f === 'Appearance')) chips.push(`<li>${f} data unlocked</li>`); });
    if (r.mastered) chips.push(`<li class="hl">Research complete</li>`);
    result = `<section class="result" aria-live="polite"><h3>${r.title}</h3>
      <div class="rl"><span>Research data +${r.gain}%</span><span>${esc(sp.name)} ${Math.round(r.prog)}%</span></div>${bar(r.prog)}<ul class="chips">${chips.join('')}</ul></section>`;
  }
  return `${topbar(L.n, 'leave')}${(e.phase === 'nothing' || e.phase === 'done') ? energyBar() : ''}<div class="status">${status}</div>${plate.includes('plate') ? '' : ''}`
    .replace('<div class="status">', plate + '<div class="status">') + `${controls}${result}`;
}

function startEvolve(id) {
  const sp = SP(id), rec = sp && S.sp[id], evoSp = sp && SP(sp.id + '_evo');
  if (!sp || !rec || !evoSp) return;
  if (!rec.mastered) { toast('Fully research this monster (100%) first.'); return; }
  if (rec.drops.length < sp.dr.length) { toast(`Collect all drops first (${rec.drops.length}/${sp.dr.length}).`); return; }
  if (S.sp[evoSp.id]) { toast(`${evoSp.name} is already unlocked.`); return; }
  const cost = evoCost(sp);
  if (S.coins < cost) { toast(`Need ${num(cost - S.coins)} more coins`); return; }
  S.coins -= cost; save();
  ui.evo = {id, evoId: evoSp.id, form: ui.form || 'normal', phase: 'charge'};
  render(); window.scrollTo(0, 0);
  runEvolveSequence();
}
function finalizeEvolve() {
  const e = ui.evo; if (!e) return;
  const sp = SP(e.id), rec = S.sp[e.id], evoSp = SP(e.evoId);
  if (!sp || !rec || !evoSp || S.sp[evoSp.id]) return;
  S.sp[evoSp.id] = {prog:100, forms:['normal'], drops:[], lvMin:monLv(rec), lvMax:monLv(rec), lv:monLv(rec), xp:0, dur:TRAIN.maxDur, scans:0, mastered:true};
  rec.evolved = true; /* the old monster is consumed */
  if (S.partner === sp.id) S.partner = evoSp.id;
  if (S.last === sp.id) S.last = evoSp.id;
  S.dp += 50; save();
}
function runEvolveSequence() {
  const steps = [['charge', 950], ['flash', 420], ['reveal', 1250], ['done', 0]];
  let i = 0;
  const step = () => {
    if (!ui.evo) return;
    ui.evo.phase = steps[i][0];
    if (ui.evo.phase === 'flash') finalizeEvolve();
    render();
    const dur = steps[i][1]; i++;
    if (dur) ui.evoTimer = setTimeout(step, dur);
  };
  step();
}
function endEvolve() {
  const e = ui.evo; if (!e) return;
  clearTimeout(ui.evoTimer);
  ui.detail = e.evoId; ui.form = 'normal'; ui.evo = null;
  render(); window.scrollTo(0, 0);
}

function menuState(m) {
  const cs = [...m.children]; if (!cs.length) return null;
  const r = m.getBoundingClientRect(), tol = 3;
  const first = cs[0].getBoundingClientRect(), last = cs[cs.length - 1].getBoundingClientRect();
  const w = first.width || 1;
  let idx = 0; cs.forEach((c, i) => { if (c.getBoundingClientRect().left < r.left - w / 2) idx = i + 1; });
  return {cs, r, tol, atStart: first.left >= r.left - tol, atEnd: last.right <= r.right + tol, idx};
}
function updateMenu() {
  const m = document.getElementById('labMenu'); if (!m) return;
  const st = menuState(m); if (!st) return;
  const wrap = m.parentElement;
  const prev = wrap.querySelector('.menuArrow.prev'), next = wrap.querySelector('.menuArrow.next');
  if (prev) prev.hidden = st.atStart;
  if (next) next.hidden = st.atEnd;
  const dots = wrap.querySelectorAll('.menuDots i');
  const on = st.atEnd ? dots.length - 1 : Math.min(st.idx, dots.length - 1);
  dots.forEach((d, i) => d.classList.toggle('on', i === on));
}
function menuScroll(dir) {
  const m = document.getElementById('labMenu'); if (!m) return;
  const st = menuState(m); if (!st) return;
  if (dir > 0) {
    const c = st.cs.find(c => c.getBoundingClientRect().right > st.r.right + st.tol);
    if (c) c.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'end'});
  } else {
    const c = [...st.cs].reverse().find(c => c.getBoundingClientRect().left < st.r.left - st.tol);
    if (c) c.scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'start'});
  }
}
document.addEventListener('scroll', (e) => { if (e.target && e.target.id === 'labMenu') updateMenu(); }, true);
window.addEventListener('resize', updateMenu);
function render() {
  let h = '';
  document.body.classList.toggle('bg-home', ui.screen === 'home');
  document.body.classList.toggle('bg-fight', (ui.screen === 'battle' || ui.screen === 'dungeon') && !!ui.battle);
  document.documentElement.style.setProperty('--home-img', `url('assets/backgrounds/${BG_OPTS[S.bg] ? BG_OPTS[S.bg].f : BG_OPTS.bright.f}')`);
  if (ui.evo) { app.innerHTML = viewEvolve(); return; }
  const oldMenu = document.getElementById('labMenu'), keepX = oldMenu ? oldMenu.scrollLeft : 0;
  switch (ui.screen) {
    case 'home': h = viewHome(); break;
    case 'explore': h = viewExplore(); break;
    case 'db': h = ui.detail ? viewDetail() : viewDb(); break;
    case 'research': h = viewResearch(); break;
    case 'lab': h = viewLab(); break;
    case 'inv': h = viewInventory(); break;
    case 'profile': h = viewProfile(); break;
    case 'settings': h = viewSettings(); break;
    case 'quests': h = viewQuests(); break;
    case 'battle': h = viewBattle(); break;
    case 'dungeon': h = viewDungeon(); break;
  }
  app.innerHTML = h;
  if (ui.screen === 'home') { const m = document.getElementById('labMenu'); if (m) { if (keepX) m.scrollLeft = keepX; updateMenu(); requestAnimationFrame(updateMenu); } }
  if ((ui.screen === 'battle' || ui.screen === 'dungeon') && ui.battle && ui.battle.over === 'win') animateRewardCounts();
  if (ui.fx) playFx();
}
function go(to) {
  stopGauge(); clearTimeout(ui.timer); clearTimeout(ui.evoTimer);
  ui.enc = null; ui.detail = null; ui.evoAsk = null; ui.reset = false; ui.screen = to; ui.locPicked = false; ui.evo = null; ui.battle = null; ui.bPick = null; ui.dg = null; ui.dgSel = null;
  render(); window.scrollTo(0, 0);
}

/* ---------- encounter logic ---------- */
function pickSpecies(locId) {
  const pool = SPECIES.filter(s => s.loc === locId && !s.hidden), sc = S.tech.scanner, base = [55, 28, 12, 4, 1.4, .5];
  const w = pool.map(s => base[s.r] * (s.r >= 2 ? 1 + .4 * sc : 1));
  let x = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function rollForm() {
  const r = S.tech.radar, t = [];
  if (r >= 1) t.push(['ancient', .06]);
  if (r >= 2) { t.push(['alpha', .04]); t.push(['corrupted', .04]); }
  if (r >= 3) t.push(['shiny', .02]);
  let x = Math.random();
  for (const [f, p] of t) { if (x < p) return f; x -= p; }
  return 'normal';
}
/* Catch difficulty vs. level. A monster whose level is above the researcher's level (1 + scans/6)
   is harder to scan: narrower zone, faster needle, and it bolts sooner after a miss.
   Tweak the numbers in DIFF to make the game easier / harder. */
const DIFF = {gap:60, zoneCut:.45, minZone:.06, speedUp:.3, fleeUp:.3};
const researcherLv = () => 1 + Math.floor(S.scans / 6);
const lvPenalty = (lv) => Math.max(0, Math.min(1, (lv - researcherLv()) / DIFF.gap));
function threatLabel(pen) { return pen >= .75 ? 'Extreme' : pen >= .4 ? 'Dangerous' : pen >= .15 ? 'Tough' : ''; }
function newZone(sp, pen) {
  pen = pen || 0;
  const w = Math.max(DIFF.minZone, (.19 - sp.r * .022 + S.tech.scanner * .034) * (1 - DIFF.zoneCut * pen));
  return {w, c: w / 2 + .05 + Math.random() * (.9 - w)};
}
function startExplore() {
  if (!S.locs.includes(ui.loc)) { toast(`Buy the ${LOC(ui.loc).n} permit in the Laboratory`); return; }
  tickEnergy();
  const ecost = energyCost(ui.loc);
  if (S.energy < ecost) { toast(energyMsg(ecost)); return; }
  stopGauge(); clearTimeout(ui.timer);
  if (S.energy >= emax()) S.energyAt = Date.now(); /* regen clock starts when a full tank is first used */
  S.energy -= ecost;
  ensureDaily(); S.trips++; S.daily.trips++; save();
  ui.enc = {loc: ui.loc, phase: 'searching', charges: maxCharges(), last: null, known: false, pos: 0};
  render();
  ui.timer = setTimeout(() => {
    const e = ui.enc; if (!e) return;
    const nothingChance = Math.max(.09, .22 - S.tech.radar * .035);
    if (Math.random() < nothingChance) { e.phase = 'nothing'; render(); return; }
    const sp = pickSpecies(e.loc), form = rollForm();
    e.sp = sp; e.form = form; e.known = !!S.sp[sp.id];
    e.lv = Math.round((sp.lv[0] + Math.random() * (sp.lv[1] - sp.lv[0])) * FORMS[form].lv);
    e.pen = lvPenalty(e.lv);
    e.zone = newZone(sp, e.pen); e.phase = 'found'; e.misses = 0;
    render(); startGauge();
  }, 1400);
}
function startGauge() {
  stopGauge();
  const e = ui.enc; if (!e || !e.sp) return;
  const t0 = performance.now(), speed = Math.max(.95, 1.35 + e.sp.r * .2 - S.tech.scanner * .11) * (1 + DIFF.speedUp * (e.pen || 0)) * [1, .9, .8, .8, .8][S.tech.focus];
  const tick = (now) => {
    const ph = (Math.max(0, now - t0) / 1000 * speed) % 2, p = ph > 1 ? 2 - ph : ph;
    e.pos = p;
    const el = document.getElementById('needle'); if (el) el.style.left = (p * 100) + '%';
    ui.raf = requestAnimationFrame(tick);
  };
  ui.raf = requestAnimationFrame(tick);
}
function stopGauge() { if (ui.raf) { cancelAnimationFrame(ui.raf); ui.raf = 0; } }
function resolveScan(e, q) {
  const sp = e.sp, f = e.form, F = FORMS[f];
  ensureDaily();
  const Q = {weak:{g:8, m:.6, t:'Weak scan'}, good:{g:15, m:1, t:'Good scan'}, perfect:{g:22, m:1.5, t:'Perfect scan'}}[q];
  let rec = S.sp[sp.id]; const first = !rec;
  if (first) rec = S.sp[sp.id] = {prog:0, forms:[], drops:[], lvMin:e.lv, lvMax:e.lv, lv:e.lv, xp:0, dur:TRAIN.maxDur, scans:0, mastered:false};
  const before = rec.prog;
  const raw = Math.round(Q.g * LAB_MULT[S.tech.lab] * (f === 'normal' ? 1 : 1.5));
  const gain = Math.min(100 - before, raw);
  rec.prog = before + gain;
  const facets = FACETS.filter(([n, t]) => rec.prog >= t && (first || before < t)).map(x => x[0]);
  rec.scans++; S.scans++; S.daily.scans++; if (q === 'perfect') S.daily.perfect++;
  rec.lvMin = Math.min(rec.lvMin, e.lv); rec.lvMax = Math.max(rec.lvMax, e.lv);
  if (e.lv > monLv(rec)) { rec.lv = e.lv; rec.xp = 0; } /* a stronger specimen lifts your monster to its level */
  const newForm = !rec.forms.includes(f); if (newForm) rec.forms.push(f);
  let dp = Math.round(BASE_DP[sp.r] * Q.m * F.mult * DPKIT[S.dpkit]);
  let coins = Math.round(BASE_COIN[sp.r] * Q.m * F.mult * KIT[S.kit]);
  if (first) dp += 10;
  if (newForm && f !== 'normal') dp += 40;
  let drop = null;
  if (Math.random() < .55 + .1 * S.tech.salvage) {
    const name = sp.dr[Math.floor(Math.random() * sp.dr.length)], isNew = !rec.drops.includes(name);
    if (isNew) rec.drops.push(name);
    S.inv[name] = (S.inv[name] || 0) + 1;
    drop = {name, isNew}; coins += Math.round(BASE_COIN[sp.r] * .5 * KIT[S.kit] * (S.tech.salvage >= 2 ? 1.5 : 1));
  }
  let mastered = false;
  if (rec.prog >= 100 && !rec.mastered) { rec.mastered = true; mastered = true; dp += 50; coins += BASE_COIN[sp.r] * 10; }
  const pp = partnerPct();
  if (pp) { dp = Math.round(dp * (1 + pp / 100)); coins = Math.round(coins * (1 + pp / 100)); }
  S.dp += dp; S.coins += coins; S.last = sp.id; S.daily.coins += coins; if (first) S.daily.newsp++; save();
  return {q, title:Q.t, gain, prog:rec.prog, coins, dp, drop, first, newForm:newForm && f !== 'normal', facets, mastered};
}
function doScan() {
  const e = ui.enc; if (!e || e.phase !== 'found' || e.charges <= 0) return;
  const d = Math.abs(e.pos - e.zone.c);
  const q = d <= e.zone.w * .16 ? 'perfect' : d <= e.zone.w * .38 ? 'good' : d <= e.zone.w * .62 ? 'weak' : 'miss';
  e.known = true; e.charges--;
  if (q === 'miss') {
    e.misses = (e.misses || 0) + 1;
    e.last = {miss: true, title: 'Miss!'};
    const fleeChance = Math.min(.95, (.3 + e.misses * .2 + DIFF.fleeUp * (e.pen || 0)) * (S.tech.focus >= 3 ? .65 : 1));
    if (e.charges <= 0 || Math.random() < fleeChance) { e.phase = 'done'; e.fled = true; stopGauge(); render(); return; }
    e.zone = newZone(e.sp, e.pen); render(); startGauge(); return;
  }
  e.last = resolveScan(e, q);
  if (e.charges > 0) e.zone = newZone(e.sp, e.pen); else { e.phase = 'done'; stopGauge(); }
  render();
  if (e.charges > 0) startGauge();
}

/* ---------- actions ---------- */
function buyTech(k, i) {
  const T = TECH[k];
  if (S.tech[k] > i) { toast('Already researched'); return true; }
  if (S.tech[k] < i) { toast('Research the previous level first'); return false; }
  const c = T.lv[i].c;
  if (S.dp < c) { toast(`Need ${num(c - S.dp)} more data`); return false; }
  S.dp -= c; S.tech[k]++; save(); ui.fx = {key:`tech:${k}:${i}`, cur:'dp'}; render(); toast(`${T.lv[i].n} researched`);
  return true;
}
/* ---------- boot / full asset preload ---------- */
const LOAD_TIPS = [
  'Menyiapkan tabung penelitian...', 'Memindai lokasi eksplorasi...',
  'Mengkalibrasi radar monster...', 'Menghangatkan mesin lab...',
  'Menyusun data spesies...', 'Mengasah kaca pembesar...',
  'Mengecek stok umpan...', 'Membuka portal riset...'
];
function collectAssetUrls() {
  const set = new Set();
  SPECIES.forEach(sp => set.add(ASSET.mon + sp.id + ASSET.monExt));
  LOCS.forEach(l => set.add(ASSET.loc + l.id + ASSET.locExt));
  set.add(ASSET.lab);
  Object.values(CARD_ICON).forEach(u => set.add(u));
  set.add('assets/icons/coin.webp');
  set.add('assets/icons/diamond.webp');
  set.add('assets/icons/avatar.webp');
  set.add('assets/backgrounds/arena.webp');
  Object.values(BG_OPTS).forEach(o => set.add('assets/backgrounds/' + o.f));
  return [...set];
}
function boot() {
  const urls = collectAssetUrls();
  const total = urls.length || 1;
  const loader = document.getElementById('loader');
  const fill = document.getElementById('loaderFill');
  const bar = document.getElementById('loaderBar');
  const pct = document.getElementById('loaderPct');
  const tip = document.getElementById('loaderTip');
  let loaded = 0, tipIdx = 0, done = false;
  const setTip = () => { if (!tip) return; tip.style.opacity = 0; setTimeout(() => { tip.textContent = LOAD_TIPS[tipIdx]; tip.style.opacity = 1; }, 160); tipIdx = (tipIdx + 1) % LOAD_TIPS.length; };
  setTip();
  const tipTimer = setInterval(setTip, 1300);
  const t0 = performance.now();
  const finish = () => {
    if (done) return; done = true;
    clearInterval(tipTimer);
    const waitLeft = Math.max(0, 450 - (performance.now() - t0));
    setTimeout(() => {
      render();
      if (loader) { loader.classList.add('hide'); setTimeout(() => loader.remove(), 550); }
    }, waitLeft);
  };
  const bump = (url, ok) => {
    if (ok) {
      if (url === ASSET.lab) HAVE.lab = true;
      else if (url.startsWith(ASSET.loc)) HAVE.loc[url.slice(ASSET.loc.length, -ASSET.locExt.length)] = true;
      else if (url.startsWith(ASSET.mon)) HAVE.mon[url.slice(ASSET.mon.length, -ASSET.monExt.length)] = true;
    }
    loaded++;
    const p = Math.min(100, Math.round(loaded / total * 100));
    if (fill) fill.style.width = p + '%';
    if (pct) pct.textContent = p + '%';
    if (bar) bar.setAttribute('aria-valuenow', p);
    if (loaded >= urls.length) finish();
  };
  if (!urls.length) { finish(); return; }
  urls.forEach(url => {
    const im = new Image();
    im.onload = () => bump(url, true);
    im.onerror = () => bump(url, false);
    im.src = url;
  });
  setTimeout(finish, 12000); /* safety net: never let a slow/broken asset trap the player on the loader */
}
document.addEventListener('contextmenu', (e) => { if (!e.target.closest('input,textarea')) e.preventDefault(); });
app.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const d = t.dataset;
  if (t.getAttribute('aria-disabled') === 'true' && (t.classList.contains('buy') || t.classList.contains('cta'))) shake(t);
  switch (d.act) {
    case 'wallet': bump(t); toast(d.k === 'coins' ? `Coins ${num(S.coins)} · Earned from scans and battles. Spend them in the Lab.` : `Data ${num(S.dp)} · Earned from every scan. Spend it on Research.`); break;
    case 'go': go(d.to); break;
    case 'menuscroll': menuScroll(+d.dir); break;
    case 'pickloc': ui.loc = d.id; ui.locPicked = true; if (!S.locs.includes(d.id)) toast(`Unlock ${LOC(d.id).n} in the Laboratory for ${num(LOC(d.id).cost)} coins`); render(); break;
    case 'closedock': ui.locPicked = false; render(); break;
    case 'explore': if (t.getAttribute('aria-disabled') === 'true') { toast(S.locs.includes(ui.loc) ? energyMsg(energyCost(ui.loc)) : `Unlock ${LOC(ui.loc).n} in the Laboratory first`); break; } startExplore(); break;
    case 'buyenergy': { const E = ENERGY_ITEMS[d.id]; if (!E) break; tickEnergy(); if (S.energy >= emax()) { toast('Energy is already full'); break; } if (S.coins < E.cost) { toast(`Need ${num(E.cost - S.coins)} more coins`); break; } S.coins -= E.cost; S.energy = Math.min(emax(), S.energy + E.gain); if (S.energy >= emax()) S.energyAt = Date.now(); save(); ui.fx = {key:`energy:${d.id}`, cur:'coins'}; render(); toast(`${E.n} used · Energy ${S.energy}/${emax()}`); break; }
    case 'scan': doScan(); break;
    case 'leave': stopGauge(); clearTimeout(ui.timer); ui.enc = null; render(); break;
    case 'filter': ui.filter = d.id; render(); break;
    case 'fooditem': { const F = FOOD[d.id]; if (!F) break; bump(t); toast(S.food[d.id] > 0 ? `${F.n}: restores ${F.dur} durability. Feed it from a monster's page or before a battle.` : `${F.n}: none left. Buy some in the Laboratory.`); break; }
    case 'invfilter': ui.invFilter = d.id; render(); break;
    case 'open': if (!S.sp[d.id]) { toast('Not discovered yet. Keep exploring.'); break; } ui.evoAsk = null; ui.detail = d.id; ui.form = 'normal'; render(); window.scrollTo(0, 0); break;
    case 'form': ui.form = d.id; render(); break;
    case 'techtab': ui.techTab = d.id; render(); break;
    case 'buytech': if (!buyTech(d.k, +d.i)) shake(t); break;
    case 'buyloc': { const l = LOC(d.id); if (S.coins < l.cost) { toast(`Need ${num(l.cost - S.coins)} more coins`); break; } S.coins -= l.cost; S.locs.push(l.id); save(); ui.fx = {key:`loc:${l.id}`, cur:'coins'}; render(); toast(`${l.n} is open`); break; }
    case 'buyfood': { const F = FOOD[d.id]; if (!F) break; if (S.coins < F.cost) { toast(`Need ${num(F.cost - S.coins)} more coins`); break; } S.coins -= F.cost; S.food[d.id]++; save(); ui.fx = {key:`food:${d.id}`, cur:'coins'}; render(); toast(`${F.n} bought`); break; }
    case 'feed': { const rec = S.sp[d.id], F = FOOD[d.food]; if (!rec || !F || !isOwned(d.id)) break;
      if (durOf(rec) >= TRAIN.maxDur) { toast('Already full'); break; }
      if (S.food[d.food] <= 0) { toast(`No ${F.short} left. Buy some in the Laboratory`); break; }
      S.food[d.food]--; rec.dur = Math.min(TRAIN.maxDur, durOf(rec) + F.dur); save(); render(); toast(`${SP(d.id).name} ate a ${F.short.toLowerCase()}`); break; }
    case 'buykit': { const c = KIT_COST[S.kit]; if (S.coins < c) { toast(`Need ${num(c - S.coins)} more coins`); break; } S.coins -= c; S.kit++; save(); ui.fx = {key:'kit', cur:'coins'}; render(); toast('Field kit upgraded'); break; }
    case 'buydpkit': { const c = DPKIT_COST[S.dpkit]; if (S.coins < c) { toast(`Need ${num(c - S.coins)} more coins`); break; } S.coins -= c; S.dpkit++; save(); ui.fx = {key:'dpkit', cur:'coins'}; render(); toast('Data extractor upgraded'); break; }
    case 'claimquest': { ensureDaily(); const entry = S.quests.list.find(q => q.id === d.id); if (!entry || entry.claimed) break; const {Q, val} = questProgress(d.id); if (val < Q.goal) break; entry.claimed = true; S.coins += Q.reward.coins || 0; S.dp += Q.reward.dp || 0; save(); render(); toast('Quest reward claimed'); break; }
    case 'setpartner': { if (!isOwned(d.id)) break; S.partner = S.partner === d.id ? null : d.id; save(); render(); toast(S.partner ? 'Partner set' : 'Partner removed'); break; }
    case 'evolve': if (t.getAttribute('aria-disabled') === 'true') { toast('Not enough coins yet'); break; } if (ui.evoAsk !== d.id) { ui.evoAsk = d.id; render(); break; } ui.evoAsk = null; startEvolve(d.id); break;
    case 'evodone': endEvolve(); break;
    case 'resetarm': ui.reset = true; render(); break;
    case 'setbg': { if (!BG_OPTS[d.id]) break; S.bg = d.id; save(); render(); toast(`${BG_OPTS[d.id].n} applied`); break; }
    case 'resetdo': S = def(); save(); ui.reset = false; go('home'); toast('Progress erased'); break;
    case 'bpick': if (!isOwned(d.id)) break; ui.bPick = ui.bPick === d.id ? null : d.id; render(); break;
    case 'bpickclose': ui.bPick = null; render(); break;
    case 'battlestart': if (!ui.bPick) break; startBattle(ui.bPick); break;
    case 'bmove': battleTurn(d.id); break;
    case 'battleagain': { const pid = ui.battle && ui.battle.p.id; ui.battle = null; if (pid) startBattle(pid); break; }
    case 'battleleave': if (ui.dg) { ui.battle = null; ui.dg = null; ui.dgSel = null; ui.bPick = null; render(); break; } ui.battle = null; ui.bPick = null; go('home'); break;
    case 'dgpick': { const D = DG_BY(d.id); if (!D) break; if (!dgUnlocked(D)) { toast(dgLockMsg(D)); break; } ui.dgSel = d.id; ui.bPick = null; render(); window.scrollTo(0, 0); break; }
    case 'bpotion': battlePotion(d.id); break;
    case 'dgpotion': dgUsePotion(d.id); break;
    case 'buypotion': { const P = POTIONS[d.id]; if (!P) break; if (S.coins < P.cost) { toast(`Need ${num(P.cost - S.coins)} more coins`); break; } S.coins -= P.cost; S.potions[d.id]++; save(); ui.fx = {key:`potion:${d.id}`, cur:'coins'}; render(); toast(`${P.n} bought \u00b7 you have ${S.potions[d.id]}`); break; }
    case 'dgback': ui.dgSel = null; ui.bPick = null; render(); break;
    case 'dgstart': if (ui.dgSel && ui.bPick) startDungeon(ui.dgSel, ui.bPick); break;
    case 'dgnext': { const b = ui.battle; if (!b || !b.dg || b.over !== 'win') break; b.dg.hp = b.p.hp; b.dg.floor++; dgStartFloor(); break; }
    case 'dgleave': ui.battle = null; ui.dg = null; ui.dgSel = null; ui.bPick = null; render(); break;
  }
});
boot();
setInterval(updateEnergyUi, 1000);
})();
