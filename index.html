<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
/* Some mobile browsers' "Desktop site" mode ignores width=device-width and
   substitutes a wide virtual viewport (e.g. ~980px), which shrinks this
   mobile-first layout. Force the viewport back to the real screen width. */
(function(){
  try{
    var realWidth = window.screen && window.screen.width;
    if (realWidth && realWidth > 0 && realWidth < 600) {
      var vp = document.querySelector('meta[name="viewport"]');
      if (vp) vp.setAttribute('content', 'width=' + realWidth + ', initial-scale=1, viewport-fit=cover');
    }
  }catch(e){}
})();
</script>
<title>Monster Research Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060B18; --surface:#0E1830; --surface2:#152444; --ink:#EAF3FF; --ink2:#7F94BE; --line:#213257;
  --lamp:#37C6F4; --lampink:#03131F; --moss:#37C6F4; --signal:#FF5C7A;
  --plate:#040914; --plateline:#2D4A78; --gold-hi:#9FE8FF;
  --home-img:url('assets/backgrounds/bg-bright.jpg');
  --display:"Orbitron","Segoe UI",system-ui,sans-serif;
  --body:"Rajdhani","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060B18; --surface:#0E1830; --surface2:#152444; --ink:#EAF3FF; --ink2:#7F94BE; --line:#213257;
    --lamp:#37C6F4; --lampink:#03131F; --moss:#37C6F4; --signal:#FF5C7A;
    --plate:#040914; --plateline:#2D4A78; --gold-hi:#9FE8FF;
  }
}
:root[data-theme="dark"]{
  --bg:#060B18; --surface:#0E1830; --surface2:#152444; --ink:#EAF3FF; --ink2:#7F94BE; --line:#213257;
  --lamp:#37C6F4; --lampink:#03131F; --moss:#37C6F4; --signal:#FF5C7A;
  --plate:#040914; --plateline:#2D4A78; --gold-hi:#9FE8FF;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;color:var(--ink);font:400 16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(ellipse 140% 55% at 50% -12%,color-mix(in srgb,var(--lamp) 16%,transparent),transparent 62%),
    var(--bg)}
body.bg-home .app{
  background:
    linear-gradient(180deg,rgba(6,11,24,.12),rgba(6,11,24,.45) 60%,var(--bg) 92%),
    var(--home-img);
  background-size:100% auto,cover;
  background-position:top,center top;
  background-repeat:no-repeat,no-repeat}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 14px;zoom:var(--ui-scale,1)}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
svg{display:block}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);
  background:linear-gradient(var(--bg) 82%,transparent);z-index:5;border-bottom:1px solid var(--line);margin-bottom:2px}
.top h2{font:700 21px/1.15 var(--display);flex:1;letter-spacing:.01em}
.back{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none;
  border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.back svg{width:20px;height:20px}
.res{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:5px 11px 5px 8px;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.dot{width:16px;height:16px;flex:none;object-fit:contain;filter:drop-shadow(0 0 4px currentColor)}

/* status bar (home) */
.statusbar{display:flex;align-items:center;gap:6px;padding:8px 0 2px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.avwrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;
  padding:4px 10px 4px 4px;flex:1;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.av{width:28px;height:28px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--lamp) 55%,var(--surface2)),var(--surface2) 70%);
  border:2px solid var(--lamp);display:grid;place-items:center;color:var(--lamp);box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 45%,transparent)}
.av svg{width:14px;height:14px}
.avmeta{min-width:0;flex:1}
.avmeta b{display:block;font:700 11.5px/1.1 var(--display);letter-spacing:.02em}
.statusbar .pill{background:var(--surface2);padding:4px 9px 4px 6px;font-size:12px}
.plusbtn{width:18px;height:18px;border-radius:50%;background:var(--lamp);color:var(--lampink);display:grid;place-items:center;
  font:800 13px/1 var(--display);flex:none;margin-left:2px;box-shadow:0 0 8px color-mix(in srgb,var(--lamp) 55%,transparent)}
.gear{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.gear svg{width:15px;height:15px;color:var(--ink2)}

/* home */
.heroRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0 7px}
.rankline{color:var(--lamp);font-weight:600;font-size:11.5px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;display:inline-flex;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.questchip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;font-size:11.5px;font-weight:700;flex:none}
.questchip i{width:6px;height:6px;border-radius:50%;background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.questchip.ready{background:color-mix(in srgb,var(--lamp) 20%,var(--surface));color:var(--lamp);border-color:var(--lamp)}
.tube{position:relative;margin:0 0 8px;padding-top:46%;border-radius:24px;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 100%,color-mix(in srgb,var(--lamp) 14%,var(--surface)),var(--bg) 78%),var(--surface);
  border:1px solid var(--line);box-shadow:inset 0 0 30px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.35)}
.tubein{position:absolute;inset:0;display:grid;place-items:center}
.cyl{position:relative;width:64%;height:92%;border-radius:40% 40% 46% 46%/16% 16% 22% 22%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--lamp) 22%,transparent),color-mix(in srgb,var(--lamp) 8%,transparent) 70%,transparent);
  border:2px solid color-mix(in srgb,var(--lamp) 65%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--lamp) 55%,transparent),inset 0 0 30px color-mix(in srgb,var(--lamp) 25%,transparent)}
.cyl::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(0deg,transparent 0 7px,color-mix(in srgb,var(--lamp) 10%,transparent) 7px 8px);opacity:.5}
.cyl .mon,.cyl .mon.img{position:absolute;left:3%;top:4%;width:94%;height:94%;z-index:2;filter:drop-shadow(0 0 16px color-mix(in srgb,var(--lamp) 65%,transparent))}
.cylbase{position:absolute;left:50%;bottom:6%;width:56%;height:10%;transform:translateX(-50%);border-radius:50%;
  background:var(--plate);border:2px solid var(--plateline);box-shadow:0 0 20px color-mix(in srgb,var(--lamp) 40%,transparent)}
.tubetag{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;font-size:10px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:5px}
.tubetag i{width:5px;height:5px;border-radius:50%;background:var(--lamp);box-shadow:0 0 6px var(--lamp)}
.labart{height:auto;background:var(--surface)}
.labart .dish{transform-origin:142px 42px;animation:sway 6s ease-in-out infinite}
.labart .sig{animation:pulse 2.4s ease-out infinite;opacity:0}
.labart .sig2{animation-delay:.8s}
@keyframes sway{50%{transform:rotate(14deg)}}
@keyframes pulse{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
.infocard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 14px;overflow:hidden}
.infocard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.ictop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.icname{font:700 16px/1.15 var(--display);letter-spacing:.01em}
.icbadges{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.icrar{font:700 10.5px var(--body);padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--lamp) 22%,var(--surface2));color:var(--lamp)}
.icel{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink2)}
.icel i{width:8px;height:8px;border-radius:50%}
.iclvl{font:600 11px var(--display);color:var(--ink2);margin-top:7px}
.homeAction{display:block;margin:0 0 8px}
.specCard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 11px;overflow:hidden}
.specCard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.scTop{display:flex;gap:10px;align-items:center}
.scThumb{position:relative;flex:none;width:50px;height:50px;border-radius:12px;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 50% 100%,color-mix(in srgb,var(--lamp) 22%,var(--surface2)),var(--bg) 78%);
  border:2px solid color-mix(in srgb,var(--lamp) 55%,var(--line));box-shadow:0 0 14px color-mix(in srgb,var(--lamp) 30%,transparent)}
.scThumb .mon,.scThumb .mon.img{position:absolute;left:4%;top:6%;width:92%;height:92%}
.scMeta{flex:1;min-width:0}
.scNameRow{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.scName{font:700 16px/1.15 var(--display);letter-spacing:.01em}
.scBadges{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.scRes{display:flex;align-items:center;gap:8px;margin-top:6px}
.scRes span{font:600 11px var(--display);color:var(--ink2);flex:none}
.scRes .bar{flex:1;margin:0}
.scDiv{height:1px;background:var(--line);margin:9px 0 7px}
.scBottom{display:flex;gap:8px;align-items:stretch}
.scStats{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.scStats .statrow{padding:2px 0;font-size:11.5px;border-top:0}
.scStats .statrow .si{width:13px;height:13px}
.scExplore{flex:none;width:92px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font:800 12.5px/1.1 var(--display);letter-spacing:.02em;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--lamp) 55%,color-mix(in srgb,var(--lamp) 72%,black) 100%);
  color:var(--lampink);border:1px solid color-mix(in srgb,var(--lamp) 55%,black);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 color-mix(in srgb,var(--lamp) 45%,black),0 8px 16px rgba(0,0,0,.3)}
.scExplore svg{width:19px;height:19px}
.scExplore:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 color-mix(in srgb,var(--lamp) 45%,black),0 3px 8px rgba(0,0,0,.25)}
.stats{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;overflow:hidden}
.stats::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--lamp),transparent)}
.big .n{font:700 46px/1 var(--display);letter-spacing:0;color:var(--ink);text-shadow:0 0 18px color-mix(in srgb,var(--lamp) 22%,transparent)}
.big .of{font:600 17px var(--display);color:var(--ink2);margin-left:5px}
.big .lb{display:block;color:var(--ink2);font-size:13px;margin-top:3px;letter-spacing:.02em}
.rs .rt{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.rs .rt b{font:700 18px var(--display);color:var(--lamp)}
.mini-res{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.statrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12px}
.statrow:first-of-type{border-top:0}
.statrow .si{color:var(--lamp);flex:none;width:14px;height:14px}
.statrow .sl{flex:1;color:var(--ink2);font-weight:600}
.statrow .sv{font-weight:700}
.cta.sm{min-height:40px;font-size:13px}
.menu{margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.gcard{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  text-align:left;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.25);aspect-ratio:1/1.05}
.gbanner{position:absolute;inset:0;display:grid;place-items:center;color:#fff;overflow:hidden}
.gbanner svg{width:19px;height:19px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));position:relative;z-index:1}
.gbanner img{position:absolute;left:10%;top:6%;width:80%;height:68%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.gbody{position:relative;z-index:2;margin-top:auto;padding:26px 8px 8px;
  background:linear-gradient(to top,rgba(4,9,20,.95) 0%,rgba(4,9,20,.72) 45%,transparent 100%)}
.gt{font:700 10.5px/1.15 var(--display);letter-spacing:.02em;color:#fff}
.gs{font-size:9.5px;color:var(--ink2);margin-top:2px;line-height:1.2}
.gcard .chev{position:absolute;right:9px;bottom:9px;color:var(--ink2);opacity:.7;z-index:2}
.gcard .badge{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--lamp);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--lamp) 28%,transparent);z-index:2}
.questpanel{margin-top:16px}
.questpanel h3{font:700 15.5px/1 var(--display);padding:2px 0 10px}
.qrow{padding:10px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qtop{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:5px}
.qtop .qr{color:var(--lamp);flex:none}
.qclaim{margin-top:7px;background:var(--lamp);color:var(--lampink);font-weight:700;padding:7px 14px;border-radius:99px;font-size:12.5px}

/* bars */
.bar{position:relative;height:9px;border-radius:99px;background:var(--surface2);margin:8px 0;
  border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s;
  background:linear-gradient(90deg,color-mix(in srgb,var(--moss) 75%,black),var(--moss))}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--surface);opacity:.9}
.bar.sm{height:6px;margin:4px 0 0}
.bar.sm b{display:none}

/* explore */
.locs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line);min-height:118px}
.loc.sel{border-color:var(--lamp);box-shadow:0 0 0 1px var(--lamp),0 0 16px color-mix(in srgb,var(--lamp) 30%,transparent)}
.loc .lic{width:36px;height:36px;border-radius:10px;background:var(--tint);color:#fff;display:grid;place-items:center;
  box-shadow:inset 0 -2px 5px rgba(0,0,0,.3),inset 0 2px 2px rgba(255,255,255,.25)}
.loc .lic svg{width:20px;height:20px}
.loc .ln{font:700 16px/1.1 var(--display)}
.loc .lb{font-size:12.5px;color:var(--ink2);line-height:1.3}
.loc.locked{opacity:.68}
.loc.locked .lic{background:var(--surface2);color:var(--ink2)}
.dock{position:sticky;bottom:0;margin:14px -16px 0;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,transparent,var(--bg) 32%)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 18px;
  border-radius:12px;font:700 17px/1 var(--display);letter-spacing:.02em;text-align:center;
  background:linear-gradient(180deg,var(--gold-hi) 0%,var(--lamp) 55%,color-mix(in srgb,var(--lamp) 72%,black) 100%);
  color:var(--lampink);border:1px solid color-mix(in srgb,var(--lamp) 55%,black);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 color-mix(in srgb,var(--lamp) 45%,black),0 8px 16px rgba(0,0,0,.3)}
.cta.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.cta[aria-disabled="true"]{opacity:.5}
.cta:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 color-mix(in srgb,var(--lamp) 45%,black),0 3px 8px rgba(0,0,0,.25)}
.linkbtn{display:block;margin:12px auto 0;padding:8px 14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* plate */
.plate{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:6px auto 14px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--plateline) 22%,var(--plate)) 0%,var(--plate) 72%);
  border:4px solid var(--plateline);overflow:hidden;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--bg),0 14px 30px rgba(0,0,0,.4),inset 0 0 46px rgba(0,0,0,.55)}
.plate::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 50%,transparent 0 30px,color-mix(in srgb,var(--gold-hi) 16%,transparent) 30px 31px)}
.sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0deg 285deg,color-mix(in srgb,var(--lamp) 65%,transparent) 360deg);
  animation:spin 3.2s linear infinite;mix-blend-mode:screen}
.plate.searching .sweep{animation-duration:1.1s}
.plate .mon{width:68%;height:68%;position:relative;z-index:2;animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.plate .mon.img{position:absolute;left:9%;top:9%;width:82%;height:82%}
.plate::before{z-index:1}
.sweep{z-index:1}
.pbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.4;z-index:0;filter:saturate(.8) brightness(.7) sepia(.15)}
.plate.lost .mon{opacity:.35;transition:opacity .8s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.35);opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.mon{display:block;overflow:visible}
.sil{filter:brightness(0) invert(1) opacity(.18)}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}

.status{text-align:center;margin-bottom:12px}
.status h3{font:700 21px/1.2 var(--display);letter-spacing:.01em}
.status p{color:var(--ink2);margin-top:3px}
.meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px 3px 8px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:600}
.tag i{width:9px;height:9px;border-radius:50%;display:block}
.pips{display:flex;justify-content:center;gap:8px;margin:2px 0 6px}
.pips span{width:26px;height:8px;border-radius:99px;background:var(--surface2)}
.pips span.on{background:var(--lamp)}
.pipcap{text-align:center;font-size:13px;color:var(--ink2)}
.gauge{position:relative;height:34px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 12px;border:1px solid var(--line)}
.gauge .z{position:absolute;top:0;bottom:0;left:var(--l);width:var(--w);background:color-mix(in srgb,var(--moss) 60%,transparent)}
.gauge .z.p{background:var(--lamp)}
.needle{position:absolute;top:-2px;bottom:-2px;left:0;width:5px;margin-left:-2.5px;border-radius:3px;background:var(--ink)}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:14px;animation:rise .3s ease-out}
.result h3{font:700 18px/1.15 var(--display)}
.result .rl{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:10px 0 0}
.chips li{background:var(--surface2);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600}
.chips li.hl{background:var(--lamp);color:var(--lampink)}
.hint{color:var(--ink2);font-size:14px;text-align:center;margin-top:10px}

/* database */
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}
.fc{flex:0 0 auto;padding:7px 13px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13.5px;border:1px solid transparent}
.fc.on{background:var(--lamp);color:var(--lampink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tile .mini{position:relative;flex:none;width:100%;height:0;padding-bottom:100%;border-radius:50%;background:var(--plate);
  overflow:hidden;margin-bottom:2px;border:2px solid var(--plateline)}
.tile .mini .mon{position:absolute;left:10%;top:10%;width:80%;height:80%}
.tn{font:700 15.5px/1.1 var(--display)}
.tr{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:600}
.tr i{width:9px;height:9px;border-radius:50%;display:block}
.tile.unk .tn{color:var(--ink2)}
.count{color:var(--ink2);font-size:14px;margin:0 0 10px}

/* detail */
.dhead{text-align:center}
.dhead h3{font:700 26px/1.1 var(--display);letter-spacing:.01em}
.forms{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0 4px}
.form{padding:5px 12px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13.5px}
.form.on{background:var(--lamp);color:var(--lampink)}
.form.unk{background:transparent;border:1px dashed var(--line);color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 16px 10px;margin-top:14px}
.panel h3{font:700 17px/1 var(--display);padding:12px 0 4px}
.frow{display:grid;grid-template-columns:112px 1fr;gap:8px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.frow:first-of-type{border-top:0}
.fl{font-weight:700;display:flex;gap:6px;align-items:flex-start;font-size:14.5px;line-height:1.25}
.fl i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink2);display:block;flex:none}
.fl.ok i{background:var(--moss);border-color:var(--moss)}
.redact{height:14px;border-radius:5px;margin-top:3px;background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--line) 6px 12px)}
.redcap{font-size:13px;color:var(--ink2);margin-top:5px}

/* research tree */
.root{margin:2px auto 0;width:fit-content;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:14px;padding:10px 18px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.root b{display:block;font:700 17px/1.1 var(--display);color:var(--lamp)}
.root span{font-size:13.5px;color:var(--ink2)}
.fork{position:relative;height:24px}
.fork s{position:absolute;background:var(--line);text-decoration:none}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.branch{display:flex;flex-direction:column;gap:12px}
.bh{text-align:center;padding:2px 2px 0}
.bh b{display:block;font:700 17px/1.1 var(--display)}
.bh span{font-size:12px;color:var(--ink2);line-height:1.25;display:block;margin-top:2px}
.node{position:relative;display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:12px;background:var(--surface);
  border:2px solid var(--line);min-height:112px}
.node::before{content:"";position:absolute;left:50%;top:-14px;height:12px;width:2px;margin-left:-1px;background:var(--line)}
.node .nt{font:700 14px/1.15 var(--display)}
.node .nd{font-size:12px;line-height:1.3;color:var(--ink2);flex:1}
.node .nc{font-weight:700;font-size:12.5px}
.node.owned{background:var(--moss);border-color:var(--moss);color:#fff}
.node.owned .nd{color:rgba(255,255,255,.9)}
.node.next{border-color:var(--lamp)}
.node.next.can{background:color-mix(in srgb,var(--lamp) 20%,var(--surface))}
.node.lock{opacity:.6;border-style:dashed}
:root[data-theme="dark"] .node.owned,:root:not([data-theme="light"]) .node.owned{color:#08210F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .node.owned{color:#fff}}

/* laboratory */
.sec{margin-top:18px}
.sec h3{font:700 19px/1.1 var(--display);margin-bottom:8px}
.sec .note{color:var(--ink2);font-size:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin-bottom:8px}
.row .rb{flex:1}
.row .rb b{font:700 16px/1.15 var(--display);display:block}
.row .rb span{font-size:13px;color:var(--ink2)}
.buy{flex:none;min-height:40px;padding:0 14px;border-radius:11px;background:var(--lamp);color:var(--lampink);font-weight:700;
  display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--lamp) 55%,black)}
.buy[aria-disabled="true"]{background:var(--surface2);color:var(--ink2);border-color:var(--line)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.kv b{display:block;font:700 22px/1.1 var(--display);color:var(--lamp)}
.kv span{font-size:13px;color:var(--ink2)}
.danger{margin-top:8px;padding:10px 14px;border-radius:12px;background:transparent;border:1px solid var(--signal);color:var(--signal);font-weight:700}
.bggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bgswatch{position:relative;aspect-ratio:9/13;border-radius:12px;overflow:hidden;background-size:cover;background-position:center top;
  border:2px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.bgswatch.on{border-color:var(--lamp);box-shadow:0 0 0 2px color-mix(in srgb,var(--lamp) 45%,transparent),0 4px 12px rgba(0,0,0,.3)}
.bgswatch span{position:absolute;left:0;right:0;bottom:0;padding:8px;font:700 11px var(--display);color:#fff;text-align:center;
  background:linear-gradient(to top,rgba(4,9,20,.9),transparent)}
.bgswatch .chk{position:absolute;right:7px;top:7px;width:16px;height:16px;border-radius:50%;background:var(--lamp);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 30%,transparent)}
.bgswatch .chk::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid var(--lampink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.danger.arm{background:var(--signal);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:99px;
  font-weight:600;font-size:14px;z-index:30;max-width:90vw;text-align:center;pointer-events:none;animation:rise .2s ease-out;
  box-shadow:0 8px 20px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
/* image assets */
.mon.img{position:relative}
.mon.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.mon.img .fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mon.img.f-ancient img{filter:grayscale(.5) sepia(.35)}
.mon.img.f-corrupted img.base{filter:hue-rotate(-70deg) saturate(1.5) contrast(1.1)}
.mon.img.f-corrupted img.ghost{filter:hue-rotate(170deg) saturate(2.4);opacity:.6;transform:translate(4%,-2%);
  clip-path:polygon(0 24%,100% 24%,100% 33%,0 33%,0 56%,100% 56%,100% 62%,0 62%,0 75%,100% 75%,100% 80%,0 80%)}
.mon.img.f-alpha{transform:scale(1.1);transform-origin:50% 90%}
.mon.img.f-alpha img{filter:saturate(1.25) contrast(1.05) drop-shadow(0 0 7px rgba(229,72,77,.75))}
.mon.img.f-shiny img{filter:hue-rotate(115deg) saturate(1.25) brightness(1.1)}
.lban{height:56px;border-radius:10px;background:var(--tint) center/cover no-repeat;display:grid;place-items:center;color:#fff}
.lban svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.lban.off{filter:grayscale(1) brightness(.7)}
.labimg{width:100%;aspect-ratio:12/5;object-fit:cover;display:block}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition:none!important}.sweep{animation:none!important}}

<script>
/* Fills whatever layout viewport width the browser reports — including a
   "fake" wide one from a mobile browser's Desktop Site mode — by zooming
   the #app box up to exactly match window.innerWidth. The browser then
   auto-zooms the whole page back down to fit the real screen, and since
   our box now fills the (fake) layout viewport edge-to-edge, that
   auto-zoom lands it back at the correct real-world size. This works
   regardless of what width the browser fakes, and doesn't rely on
   screen.width (some browsers fake that too).
   Uses CSS zoom rather than transform:scale() — zoom actually affects
   layout size (so no manual height bookkeeping is needed) and, unlike
   transform, it doesn't break position:sticky/fixed on children.
   On a real desktop with a mouse, this is a no-op: pointer:coarse is
   false there, so the normal responsive max-width:480px card layout is
   left alone. */
(function(){
  if(!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) return;
  var appEl = document.getElementById('app');
  function applyScale(){
    appEl.style.setProperty('--ui-scale', 1);
    var naturalW = appEl.getBoundingClientRect().width;
    if(!naturalW) return;
    var scale = window.innerWidth / naturalW;
    if(!isFinite(scale) || scale <= 0) scale = 1;
    scale = Math.max(0.5, Math.min(scale, 3));
    appEl.style.setProperty('--ui-scale', scale);
  }
  applyScale();
  window.addEventListener('resize', applyScale);
  window.addEventListener('orientationchange', applyScale);
  window.addEventListener('load', applyScale);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', applyScale);
  if (window.ResizeObserver) new ResizeObserver(applyScale).observe(appEl);
})();
</script>

const totalPct = () => Object.values(S.sp).reduce((a, r) => a + r.prog, 0) / (SPECIES.length * 100) * 100;
const bar = (p, sm) => `<div class="bar${sm ? ' sm' : ''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p)}"><i style="width:${p}%"></i>${[20,40,60,80].map(t => `<b style="left:${t}%"></b>`).join('')}</div>`;
const rarTag = (r) => `<span class="tag"><i style="background:${RAR[r].c}"></i>${RAR[r].n}</span>`;
const elTag = (el) => `<span class="tag"><i style="background:${EL[el].a}"></i>${el}</span>`;
let toastT;
function toast(m) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = m; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2300);
}
function affordable() {
  return Object.keys(TECH).some(k => { const n = TECH[k].lv[S.tech[k]]; return n && S.dp >= n.c; });
}
function topbar(title, backAct, backTo) {
  return `<header class="top"><button class="back" data-act="${backAct}" data-to="${backTo || ''}" aria-label="Back">${ic('back')}</button><h2>${title}</h2>
    <div class="res"><span class="pill"><img class="dot coin" src="assets/icons/coin.webp" alt="">${num(S.coins)}</span><span class="pill"><img class="dot dp" src="assets/icons/diamond.webp" alt="">${num(S.dp)}</span></div></header>`;
}

/* ---------- views ---------- */

  if (HAVE.lab) return `<img class="labimg" src="${ASSET.lab}" alt="" draggable="false">`;
  let mascot = '';

  if (S.last && S.sp[S.last]) sp = SP(S.last);
  if (sp) mascot = `<svg x="232" y="30" width="92" height="92" viewBox="0 0 160 160" style="overflow:visible">${monInner(sp, 'normal')}</svg>`;
  else mascot = `<svg x="232" y="30" width="92" height="92" viewBox="0 0 160 160" class="sil" style="overflow:visible">${monInner(SP('mossling'), 'normal')}</svg>`;
  return `<svg class="labart" viewBox="0 0 360 150" aria-hidden="true" role="presentation">
    <rect x="0" y="120" width="360" height="30" style="fill:var(--surface2)"/>
    <rect x="76" y="66" width="132" height="56" rx="10" style="fill:var(--ink)"/>
    <path d="M68 68Q142 20 216 68Z" style="fill:var(--moss)"/>
    <rect x="94" y="84" width="26" height="22" rx="6" style="fill:var(--lamp)"/><rect x="130" y="84" width="26" height="22" rx="6" style="fill:var(--lamp)"/>
    <rect x="168" y="92" width="24" height="30" rx="6" style="fill:var(--surface)"/>
    <g class="dish"><path d="M142 44V30" stroke-width="3" style="stroke:var(--ink)"/><path d="M124 26Q142 48 160 26" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--lamp)"/></g>

}
function statusBar() {
  const plv = 1 + Math.floor(S.scans / 6), pcur = S.scans % 6, pneed = 6;
  return `<header class="statusbar">
    <button class="avwrap" data-act="go" data-to="profile" aria-label="View profile"><span class="av">${ic('user')}</span><div class="avmeta"><b>Lv. ${plv}</b>${bar(pcur / pneed * 100, true)}</div></button>
    <span class="pill"><img class="dot dp" src="assets/icons/diamond.webp" alt="">${num(S.dp)}<button class="plusbtn" data-act="go" data-to="research" aria-label="Go to research">+</button></span>
    <span class="pill"><img class="dot coin" src="assets/icons/coin.webp" alt="">${num(S.coins)}<button class="plusbtn" data-act="go" data-to="lab" aria-label="Go to laboratory">+</button></span>
    <button class="gear" data-act="go" data-to="settings" aria-label="Settings">${ic('gear')}</button></header>`;
}
function tubeArt() {
  let sp = null;
  if (S.partner && S.sp[S.partner]) sp = SP(S.partner);
  else if (S.last && S.sp[S.last]) sp = SP(S.last);
  const inner = sp ? monSVG(sp, 'normal') : `<svg class="mon sil" viewBox="0 0 160 160">${monInner(SP('mossling'), 'normal')}</svg>`;
  const tag = sp && S.partner === sp.id ? 'ACTIVE PARTNER' : sp ? 'SIGNAL LOCKED' : 'NO SIGNAL';
  return `<div class="tube"><div class="tubetag"><i></i>${tag}</div>
    <div class="tubein"><div class="cyl">${inner}</div><div class="cylbase"></div></div></div>`;
}
function specCard() {
  let sp = null, rec = null;
  if (S.partner && S.sp[S.partner]) { sp = SP(S.partner); rec = S.sp[S.partner]; }
  else if (S.last && S.sp[S.last]) { sp = SP(S.last); rec = S.sp[S.last]; }
  const rfPct = [0, 40, 80, 120][S.tech.scanner];
  const rsPct = Math.round((LAB_MULT[S.tech.lab] - 1) * 100);
  const maxLv = sp ? sp.lv[1] : '—';
  const pp = partnerPct();
  const thumb = sp ? monSVG(sp, 'normal') : `<svg class="mon sil" viewBox="0 0 160 160">${monInner(SP('mossling'), 'normal')}</svg>`;
  return `<section class="specCard" aria-label="Latest specimen">
    <div class="scTop">
      <div class="scThumb">${thumb}</div>
      <div class="scMeta">
        <div class="scNameRow"><span class="scName">${sp ? esc(sp.name) : 'No Specimen'}</span>${sp ? elTag(sp.el) : ''}</div>
        <div class="scBadges">${sp ? `<span class="icrar">${RAR[sp.r].n}</span>` : `<span class="ms" style="color:var(--ink2);font-size:12.5px">Explore an area to detect one</span>`}</div>
        ${sp ? `<div class="scRes"><span>Research</span>${bar(rec.prog)}<span>${Math.round(rec.prog)}%</span></div>` : ''}
      </div>
    </div>
    <div class="scDiv"></div>
    <div class="scBottom">
      <div class="scStats">
        <div class="statrow"><span class="si">${ic('research')}</span><span class="sl">Research Speed</span><span class="sv">+${rsPct}%</span></div>
        <div class="statrow"><span class="si">${ic('explore')}</span><span class="sl">Capture Chance</span><span class="sv">+${rfPct}%</span></div>
        <div class="statrow"><span class="si">${ic('db')}</span><span class="sl">Max Level</span><span class="sv">${maxLv}</span></div>
        ${S.partner ? `<div class="statrow"><span class="si">${ic('user')}</span><span class="sl">Partner Bonus</span><span class="sv">+${pp}%</span></div>` : ''}
      </div>
      <button class="scExplore" data-act="go" data-to="explore">${ic('explore')}<span>Explore</span></button>
    </div>
  </section>`;
}
function questsReadyCount() {
  ensureDaily();
  return S.quests.list.filter(e => !e.claimed && questProgress(e.id).val >= questProgress(e.id).Q.goal).length;
}
function heroRow() {
  const disc = discovered(), r = rankFor(disc), ready = questsReadyCount();
  return `<div class="heroRow"><p class="rankline">${r.n} · ${disc}/${SPECIES.length}</p>
    <button class="questchip${ready ? ' ready' : ''}" data-act="go" data-to="quests"><i></i>${ready ? `${ready} ready` : 'Quests'}</button></div>`;
}
function questsPanel() {
  ensureDaily();
  const rows = S.quests.list.map(entry => {
    const {Q, val} = questProgress(entry.id), done = val >= Q.goal, pct = Math.min(100, val / Q.goal * 100);
    const rewardTxt = [Q.reward.coins ? `${num(Q.reward.coins)} coins` : '', Q.reward.dp ? `${num(Q.reward.dp)} data` : ''].filter(Boolean).join(' + ');
    return `<div class="qrow"><div class="qtop"><span class="ql">${Q.desc}</span><span class="qr">${entry.claimed ? 'Claimed' : done ? 'Ready' : `${val}/${Q.goal}`}</span></div>
      ${bar(pct, true)}${done && !entry.claimed ? `<button class="qclaim" data-act="claimquest" data-id="${entry.id}">Claim +${rewardTxt}</button>` : ''}</div>`;
  }).join('');
  return `<section class="panel questpanel"><h3>Daily Quests</h3>${rows}</section>`;
}
function viewQuests() { return `${topbar('Daily Quests', 'go', 'home')}${questsPanel()}`; }
function viewHome() {
  const disc = discovered();
  const tOwned = Object.values(S.tech).reduce((a, b) => a + b, 0);
  const cards = [
    {to:'db', k:'db', t:'Monsters', s:`${disc} / ${SPECIES.length} logged`, grad:'#1D4ED8,#38BDF8'},
    {to:'research', k:'research', t:'Research', s: affordable() ? 'Upgrade ready' : `${tOwned}/${TECH_TOTAL} upgrades`, grad:'#6D28D9,#C084FC', badge: affordable()},
    {to:'lab', k:'lab', t:'Lab', s:'Permits & kit', grad:'#047857,#34D399'}
  ];
  return `${statusBar()}
    ${heroRow()}
    ${tubeArt()}
    <div class="homeAction">${specCard()}</div>
    <nav class="menu" aria-label="Lab menu">${cards.map(c => `<button class="gcard" data-act="go" data-to="${c.to}"><span class="gbanner" style="background:linear-gradient(135deg,${c.grad})">${CARD_ICON[c.k] ? `<img src="${CARD_ICON[c.k]}" alt="" draggable="false">` : ic(c.k)}</span><span class="gbody"><span class="gt">${c.t.toUpperCase()}</span><br><span class="gs">${c.s}</span></span>${c.badge ? '<span class="badge" aria-label="Upgrade available"></span>' : '<span class="chev">›</span>'}</button>`).join('')}</nav>`;
}

function viewExplore() {
  if (ui.enc) return viewEncounter();
  const L = LOC(ui.loc), open = S.locs.includes(L.id);
  const tiles = LOCS.map(l => {
    const o = S.locs.includes(l.id), sel = ui.loc === l.id;
    return `<button class="loc${sel ? ' sel' : ''}${o ? '' : ' locked'}" style="--tint:${l.tint}" data-act="pickloc" data-id="${l.id}" aria-pressed="${sel}">
      ${HAVE.loc[l.id] ? `<span class="lban${o ? '' : ' off'}" style="background-image:url('${ASSET.loc}${l.id}${ASSET.locExt}')">${o ? '' : ic('lock')}</span>` : `<span class="lic">${o ? ic(l.id) : ic('lock')}</span>`}<span class="ln">${l.n}</span>
      <span class="lb">${o ? l.blurb : `Locked. Permit costs ${num(l.cost)} coins.`}</span></button>`;
  }).join('');
  return `${topbar('Explore', 'go', 'home')}
    <p class="count">Choose an area, then send the scanner out.</p>
    <div class="locs">${tiles}</div>
    <div class="dock"><button class="cta" data-act="explore" aria-disabled="${!open}">${open ? `Explore ${L.n}` : `${L.n} is locked`}</button></div>`;
}

function viewEncounter() {
  const e = ui.enc, L = LOC(e.loc);
  const chargesLeft = e.charges;
  let plate = '', status = '', controls = '';
  if (e.phase === 'searching') {
    plate = `<div class="plate searching">${plateBg(e.loc)}<div class="sweep"></div></div>`;
    status = `<h3>Scanning the area</h3><p>Sweeping the ${L.n.toLowerCase()} for signals.</p>`;
  } else if (e.phase === 'nothing') {
    plate = `<div class="plate">${plateBg(e.loc)}<div class="sweep"></div></div>`;
    status = `<h3>Only static</h3><p>No signal this time. Try again.</p>`;
    controls = `<div class="dock"><button class="cta" data-act="explore">Explore ${L.n} again</button><button class="linkbtn" data-act="leave">Change area</button></div>`;
  } else {
    const sp = e.sp;
    plate = `<div class="plate${e.phase === 'done' ? ' lost' : ''}">${plateBg(e.loc)}${e.phase === 'found' ? '<div class="sweep"></div>' : ''}${monSVG(sp, e.form)}</div>`;
    if (e.known) {
      status = `<h3>${esc(formName(sp, e.form))}</h3><div class="meta">${elTag(sp.el)}${rarTag(sp.r)}<span class="tag">Lv. ${e.lv}</span></div>`;
    } else {
      status = `<h3>A monster has been detected!</h3><p>Unidentified creature. Scan it to learn more.</p>`;
    }
    const pips = `<div class="pips" aria-label="${chargesLeft} scans left">${[0, 1, 2].map(i => `<span class="${i < chargesLeft ? 'on' : ''}"></span>`).join('')}</div>`;
    if (e.phase === 'found') {
      const z = e.zone, pl = (z.c - z.w * .2) * 100, pw = z.w * .4 * 100;
      controls = `${pips}<p class="pipcap">${chargesLeft} ${chargesLeft === 1 ? 'scan' : 'scans'} left before the signal fades</p>
        <div class="gauge" aria-hidden="true"><div class="z" style="--l:${((z.c - z.w / 2) * 100).toFixed(1)}%;--w:${(z.w * 100).toFixed(1)}%"></div><div class="z p" style="--l:${pl.toFixed(1)}%;--w:${pw.toFixed(1)}%"></div><div class="needle" id="needle"></div></div>
        <button class="cta" data-act="scan">Scan</button><button class="linkbtn" data-act="leave">Leave</button>`;
    } else {
      controls = `<p class="hint">Signal lost. The monster slipped away.</p>
        <div class="dock"><button class="cta" data-act="explore">Explore ${L.n} again</button><button class="linkbtn" data-act="leave">Change area</button></div>`;
    }
  }
  let result = '';
  if (e.last) {
    const r = e.last, sp = e.sp;
    const chips = [`<li>Coins +${num(r.coins)}</li>`, `<li>Data +${num(r.dp)}</li>`];
    if (r.drop) chips.push(`<li>${r.drop.isNew ? 'New drop' : 'Drop'}: ${esc(r.drop.name)}</li>`);
    if (r.first) chips.push(`<li class="hl">New discovery</li>`);
    if (r.newForm) chips.push(`<li class="hl">New form logged: ${esc(formName(sp, e.form))}</li>`);
    r.facets.forEach(f => { if (!(r.first && f === 'Appearance')) chips.push(`<li>${f} data unlocked</li>`); });
    if (r.mastered) chips.push(`<li class="hl">Research complete</li>`);
    result = `<section class="result" aria-live="polite"><h3>${r.title}</h3>
      <div class="rl"><span>Research data +${r.gain}%</span><span>${esc(sp.name)} ${Math.round(r.prog)}%</span></div>${bar(r.prog)}<ul class="chips">${chips.join('')}</ul></section>`;
  }
  return `${topbar(L.n, 'leave')}<div class="status">${status}</div>${plate.includes('plate') ? '' : ''}`
    .replace('<div class="status">', plate + '<div class="status">') + `${controls}${result}`;
}

function viewDb() {
  const chips = [{id:'all', n:'All'}].concat(LOCS.map(l => ({id:l.id, n:l.n}))).map(c => `<button class="fc${ui.filter === c.id ? ' on' : ''}" data-act="filter" data-id="${c.id}">${c.n}</button>`).join('');
  const list = SPECIES.filter(s => ui.filter === 'all' || s.loc === ui.filter);
  const tiles = list.map(s => {
    const rec = S.sp[s.id];
    if (!rec) return `<button class="tile unk" data-act="open" data-id="${s.id}"><div class="mini">${monSVG(s, 'normal', 'sil')}</div><div class="tn">Unknown</div><div class="tr">Not discovered yet</div>${bar(0, true)}</button>`;
    return `<button class="tile" data-act="open" data-id="${s.id}"><div class="mini">${monSVG(s, 'normal')}</div><div class="tn">${esc(s.name)}</div><div class="tr"><i style="background:${RAR[s.r].c}"></i>${RAR[s.r].n}</div>${bar(rec.prog, true)}</button>`;
  }).join('');
  return `${topbar('Monster Database', 'go', 'home')}
    <p class="count">${discovered()} of ${SPECIES.length} discovered. Full research: ${Object.values(S.sp).filter(r => r.prog >= 100).length}.</p>
    <div class="chipbar">${chips}</div><div class="grid2">${tiles}</div>`;
}

function facetText(sp, k) {
  switch (k) {
    case 'Appearance': return sp.ap;
    case 'Habitat': return `${LOC(sp.loc).n}. ${LOC(sp.loc).blurb}`;
    case 'Behavior': return sp.be;
    case 'Weakness': return `Weak to ${EL[sp.el].w}.`;
    case 'Origin': return sp.or;
    case 'Evolution': return sp.ev;
  }
  return '';
}
function viewDetail() {
  const sp = SP(ui.detail), rec = S.sp[sp.id];
  if (!rec.forms.includes(ui.form)) ui.form = rec.forms[0] || 'normal';
  const forms = FORM_KEYS.map(f => rec.forms.includes(f)
    ? `<button class="form${ui.form === f ? ' on' : ''}" data-act="form" data-id="${f}">${FORMS[f].n}</button>`
    : `<span class="form unk" aria-label="Undiscovered form">???</span>`).join('');
  const facets = FACETS.map(([k, t]) => {
    const ok = rec.prog >= t;
    return `<div class="frow"><div class="fl${ok ? ' ok' : ''}"><i></i>${k}</div><div>${ok ? facetText(sp, k) : `<div class="redact"></div><div class="redcap">Unlocks at ${t}% research</div>`}</div></div>`;
  }).join('');
  const drops = sp.dr.map(d => rec.drops.includes(d) ? `<li>${esc(d)}</li>` : `<li style="opacity:.55">???</li>`).join('');
  const lvl = rec.lvMin === rec.lvMax ? `Lv. ${rec.lvMin}` : `Lv. ${rec.lvMin} to ${rec.lvMax}`;
  const isPartner = S.partner === sp.id;
  return `${topbar(esc(sp.name), 'go', 'db')}
    <div class="plate">${plateBg(sp.loc)}${monSVG(sp, ui.form)}</div>
    <div class="dhead"><h3>${esc(formName(sp, ui.form))}</h3><div class="meta">${elTag(sp.el)}${rarTag(sp.r)}<span class="tag">${lvl} seen</span></div>
      <div class="forms">${forms}</div>
      <button class="cta sm" data-act="setpartner" data-id="${sp.id}" style="margin-top:12px">${isPartner ? 'Active Partner ✓ (tap to remove)' : 'Set as Research Partner'}</button></div>
    <section class="panel"><h3>Research ${Math.round(rec.prog)}%</h3>${bar(rec.prog)}${facets}</section>
    <section class="panel"><h3>Drops</h3><ul class="chips" style="margin-bottom:8px">${drops}</ul></section>
    <p class="hint">${rec.scans} ${rec.scans === 1 ? 'scan' : 'scans'} logged. Hidden forms need Radar upgrades.</p>`;
}

function viewResearch() {
  const col = (k) => {
    const T = TECH[k];
    const nodes = T.lv.map((n, i) => {
      const owned = S.tech[k] > i, next = S.tech[k] === i, can = next && S.dp >= n.c;
      const cls = owned ? 'owned' : next ? `next${can ? ' can' : ''}` : 'lock';
      return `<button class="node ${cls}" data-act="buytech" data-k="${k}" data-i="${i}" ${owned ? 'aria-label="' + n.n + ', researched"' : ''}>
        <span class="nt">${n.n}</span><span class="nd">${n.d}</span><span class="nc">${owned ? 'Researched' : num(n.c) + ' data'}</span></button>`;
    }).join('');
    return `<div class="branch"><div class="bh"><b>${T.n}</b><span>${T.sub}</span></div>${nodes}</div>`;
  };
  return `${topbar('Research', 'go', 'home')}
    <div class="root"><b>Monster Research</b><span>${num(S.dp)} data to spend</span></div>
    <div class="fork" aria-hidden="true"><s style="left:50%;top:0;width:2px;height:12px;margin-left:-1px"></s><s style="left:16.66%;right:16.66%;top:11px;height:2px"></s>
      <s style="left:16.66%;top:11px;width:2px;height:13px;margin-left:-1px"></s><s style="left:50%;top:11px;width:2px;height:13px;margin-left:-1px"></s><s style="left:83.33%;top:11px;width:2px;height:13px;margin-left:-1px"></s></div>
    <div class="tree">${col('scanner')}${col('lab')}${col('radar')}</div>
    <p class="hint">Every scan earns data. Rarer monsters and new forms pay more.</p>`;
}

function viewLab() {
  const pending = LOCS.filter(l => !S.locs.includes(l.id));
  const permits = pending.length ? pending.map(l => `<div class="row"><div class="rb"><b>${l.n}</b><span>${l.blurb}</span></div>
      <button class="buy" data-act="buyloc" data-id="${l.id}" aria-disabled="${S.coins < l.cost}">${num(l.cost)} coins</button></div>`).join('') : `<p class="note">Every area is open.</p>`;
  const kitNext = KIT_COST[S.kit];
  return `${topbar('Laboratory', 'go', 'home')}
    <section class="sec" style="margin-top:6px"><h3>Area permits</h3>${permits}</section>
    <section class="sec"><h3>Field kit</h3>
      <div class="row"><div class="rb"><b>Field kit level ${S.kit} of ${KIT_COST.length}</b><span>Coins from scans +${Math.round((KIT[S.kit] - 1) * 100)}% now${kitNext ? `, +${Math.round((KIT[S.kit + 1] - 1) * 100)}% next` : ''}</span></div>
      ${kitNext ? `<button class="buy" data-act="buykit" aria-disabled="${S.coins < kitNext}">${num(kitNext)} coins</button>` : `<span class="pill">Maxed</span>`}</div></section>`;
}

function viewProfile() {
  const forms = Object.values(S.sp).reduce((a, r) => a + r.forms.length, 0);
  const disc = discovered(), rk = rankFor(disc), rkIdx = RANKS.findIndex(r => r.n === rk.n), rkNext = RANKS[rkIdx + 1];
  const rkPct = rkNext ? Math.min(100, (disc - rk.min) / (rkNext.min - rk.min) * 100) : 100;
  const plv = 1 + Math.floor(S.scans / 6), pcur = S.scans % 6, pneed = 6;
  return `${topbar('Profile', 'go', 'home')}
    <section class="sec" style="margin-top:6px"><h3>Researcher level</h3>
      <div class="row"><div class="rb"><b>Level ${plv}</b><span>${pcur}/${pneed} scans to next level</span></div></div>${bar(pcur / pneed * 100)}</section>
    <section class="sec"><h3>Researcher rank</h3>
      <div class="row"><div class="rb"><b>${rk.n}</b><span>${rkNext ? `${disc}/${rkNext.min} species to ${rkNext.n}` : 'Maximum rank reached'}</span></div></div>${bar(rkPct)}</section>
    <section class="sec"><h3>Lab record</h3><div class="kv">
      <div><b>${num(S.scans)}</b><span>Scans made</span></div><div><b>${num(S.trips)}</b><span>Expeditions</span></div>
      <div><b>${forms}</b><span>Forms logged</span></div><div><b>${Object.values(S.sp).filter(r => r.prog >= 100).length}</b><span>Fully researched</span></div></div></section>`;
}

function viewSettings() {
  const swatches = Object.entries(BG_OPTS).map(([k, o]) => `<button class="bgswatch${S.bg === k ? ' on' : ''}" data-act="setbg" data-id="${k}" style="background-image:url('assets/backgrounds/${o.f}')" aria-label="${o.n}"><span>${o.n}</span>${S.bg === k ? '<i class="chk"></i>' : ''}</button>`).join('');
  return `${topbar('Settings', 'go', 'home')}
    <section class="sec" style="margin-top:6px"><h3>Home background</h3>
      <div class="bggrid">${swatches}</div></section>
    <section class="sec"><h3>Save data</h3><p class="note">Progress is saved in this browser.</p>
      <button class="danger${ui.reset ? ' arm' : ''}" data-act="${ui.reset ? 'resetdo' : 'resetarm'}">${ui.reset ? 'Tap again to erase everything' : 'Reset progress'}</button></section>`;
}

function render() {
  let h = '';
  document.body.classList.toggle('bg-home', ui.screen === 'home');
  document.documentElement.style.setProperty('--home-img', `url('assets/backgrounds/${BG_OPTS[S.bg] ? BG_OPTS[S.bg].f : BG_OPTS.bright.f}')`);
  switch (ui.screen) {
    case 'home': h = viewHome(); break;
    case 'explore': h = viewExplore(); break;
    case 'db': h = ui.detail ? viewDetail() : viewDb(); break;
    case 'research': h = viewResearch(); break;
    case 'lab': h = viewLab(); break;
    case 'profile': h = viewProfile(); break;
    case 'settings': h = viewSettings(); break;
    case 'quests': h = viewQuests(); break;
  }
  app.innerHTML = h;
}
function go(to) {
  stopGauge(); clearTimeout(ui.timer);
  ui.enc = null; ui.detail = null; ui.reset = false; ui.screen = to;
  render(); window.scrollTo(0, 0);
}

/* ---------- encounter logic ---------- */
function pickSpecies(locId) {
  const pool = SPECIES.filter(s => s.loc === locId), sc = S.tech.scanner, base = [55, 28, 12, 4, 1.4, .5];
  const w = pool.map(s => base[s.r] * (s.r >= 2 ? 1 + .4 * sc : 1));
  let x = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { x -= w[i]; if (x <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
function rollForm() {
  const r = S.tech.radar, t = [];
  if (r >= 1) t.push(['ancient', .06]);
  if (r >= 2) { t.push(['alpha', .04]); t.push(['corrupted', .04]); }
  if (r >= 3) t.push(['shiny', .02]);
  let x = Math.random();
  for (const [f, p] of t) { if (x < p) return f; x -= p; }
  return 'normal';
}
function newZone(sp) {
  const w = Math.max(.16, .30 - sp.r * .03 + S.tech.scanner * .03);
  return {w, c: w / 2 + .05 + Math.random() * (.9 - w)};
}
function startExplore() {
  if (!S.locs.includes(ui.loc)) { toast(`Buy the ${LOC(ui.loc).n} permit in the Laboratory`); return; }
  stopGauge(); clearTimeout(ui.timer);
  ensureDaily(); S.trips++; S.daily.trips++; save();
  ui.enc = {loc: ui.loc, phase: 'searching', charges: 3, last: null, known: false, pos: 0};
  render();
  ui.timer = setTimeout(() => {
    const e = ui.enc; if (!e) return;
    if (Math.random() < .12) { e.phase = 'nothing'; render(); return; }
    const sp = pickSpecies(e.loc), form = rollForm();
    e.sp = sp; e.form = form; e.known = !!S.sp[sp.id];
    e.lv = Math.round((sp.lv[0] + Math.random() * (sp.lv[1] - sp.lv[0])) * FORMS[form].lv);
    e.zone = newZone(sp); e.phase = 'found';
    render(); startGauge();
  }, 1400);
}
function startGauge() {
  stopGauge();
  const e = ui.enc; if (!e || !e.sp) return;
  const t0 = performance.now(), speed = .9 + e.sp.r * .18;
  const tick = (now) => {
    const ph = (Math.max(0, now - t0) / 1000 * speed) % 2, p = ph > 1 ? 2 - ph : ph;
    e.pos = p;
    const el = document.getElementById('needle'); if (el) el.style.left = (p * 100) + '%';
    ui.raf = requestAnimationFrame(tick);
  };
  ui.raf = requestAnimationFrame(tick);
}
function stopGauge() { if (ui.raf) { cancelAnimationFrame(ui.raf); ui.raf = 0; } }
function resolveScan(e, q) {
  const sp = e.sp, f = e.form, F = FORMS[f];
  ensureDaily();
  const Q = {weak:{g:8, m:.6, t:'Weak scan'}, good:{g:15, m:1, t:'Good scan'}, perfect:{g:22, m:1.5, t:'Perfect scan'}}[q];
  let rec = S.sp[sp.id]; const first = !rec;
  if (first) rec = S.sp[sp.id] = {prog:0, forms:[], drops:[], lvMin:e.lv, lvMax:e.lv, scans:0, mastered:false};
  const before = rec.prog;
  const raw = Math.round(Q.g * LAB_MULT[S.tech.lab] * (f === 'normal' ? 1 : 1.5));
  const gain = Math.min(100 - before, raw);
  rec.prog = before + gain;
  const facets = FACETS.filter(([n, t]) => rec.prog >= t && (first || before < t)).map(x => x[0]);
  rec.scans++; S.scans++; S.daily.scans++; if (q === 'perfect') S.daily.perfect++;
  rec.lvMin = Math.min(rec.lvMin, e.lv); rec.lvMax = Math.max(rec.lvMax, e.lv);
  const newForm = !rec.forms.includes(f); if (newForm) rec.forms.push(f);
  let dp = Math.round(BASE_DP[sp.r] * Q.m * F.mult);
  let coins = Math.round(BASE_COIN[sp.r] * Q.m * F.mult * KIT[S.kit]);
  if (first) dp += 10;
  if (newForm && f !== 'normal') dp += 40;
  let drop = null;
  if (Math.random() < .55) {
    const name = sp.dr[Math.floor(Math.random() * sp.dr.length)], isNew = !rec.drops.includes(name);
    if (isNew) rec.drops.push(name);
    drop = {name, isNew}; coins += Math.round(BASE_COIN[sp.r] * .5 * KIT[S.kit]);
  }
  let mastered = false;
  if (rec.prog >= 100 && !rec.mastered) { rec.mastered = true; mastered = true; dp += 50; coins += BASE_COIN[sp.r] * 10; }
  const pp = partnerPct();
  if (pp) { dp = Math.round(dp * (1 + pp / 100)); coins = Math.round(coins * (1 + pp / 100)); }
  S.dp += dp; S.coins += coins; S.last = sp.id; S.daily.coins += coins; if (first) S.daily.newsp++; save();
  return {q, title:Q.t, gain, prog:rec.prog, coins, dp, drop, first, newForm:newForm && f !== 'normal', facets, mastered};
}
function doScan() {
  const e = ui.enc; if (!e || e.phase !== 'found' || e.charges <= 0) return;
  const d = Math.abs(e.pos - e.zone.c);
  const q = d <= e.zone.w * .2 ? 'perfect' : d <= e.zone.w * .5 ? 'good' : 'weak';
  e.last = resolveScan(e, q); e.known = true; e.charges--;
  if (e.charges > 0) e.zone = newZone(e.sp); else { e.phase = 'done'; stopGauge(); }
  render();
  if (e.charges > 0) startGauge();
}

/* ---------- actions ---------- */
function buyTech(k, i) {
  const T = TECH[k];
  if (S.tech[k] > i) { toast('Already researched'); return; }
  if (S.tech[k] < i) { toast('Research the previous level first'); return; }
  const c = T.lv[i].c;
  if (S.dp < c) { toast(`Need ${num(c - S.dp)} more data`); return; }
  S.dp -= c; S.tech[k]++; save(); render(); toast(`${T.lv[i].n} researched`);
}
function preloadAssets() {
  let t = 0;
  const got = (bucket, key) => { bucket[key] = true; clearTimeout(t); t = setTimeout(() => { if (!ui.enc) render(); }, 150); };
  const probe = (url, ok) => { const im = new Image(); im.onload = ok; im.src = url; };
  SPECIES.forEach(s => probe(ASSET.mon + s.id + ASSET.monExt, () => got(HAVE.mon, s.id)));
  LOCS.forEach(l => probe(ASSET.loc + l.id + ASSET.locExt, () => got(HAVE.loc, l.id)));
  probe(ASSET.lab, () => got(HAVE, 'lab'));
}
app.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const d = t.dataset;
  switch (d.act) {
    case 'go': go(d.to); break;
    case 'pickloc': ui.loc = d.id; if (!S.locs.includes(d.id)) toast(`Unlock ${LOC(d.id).n} in the Laboratory for ${num(LOC(d.id).cost)} coins`); render(); break;
    case 'explore': if (t.getAttribute('aria-disabled') === 'true') { toast(`Unlock ${LOC(ui.loc).n} in the Laboratory first`); break; } startExplore(); break;
    case 'scan': doScan(); break;
    case 'leave': stopGauge(); clearTimeout(ui.timer); ui.enc = null; render(); break;
    case 'filter': ui.filter = d.id; render(); break;
    case 'open': if (!S.sp[d.id]) { toast('Not discovered yet. Keep exploring.'); break; } ui.detail = d.id; ui.form = 'normal'; render(); window.scrollTo(0, 0); break;
    case 'form': ui.form = d.id; render(); break;
    case 'buytech': buyTech(d.k, +d.i); break;
    case 'buyloc': { const l = LOC(d.id); if (S.coins < l.cost) { toast(`Need ${num(l.cost - S.coins)} more coins`); break; } S.coins -= l.cost; S.locs.push(l.id); save(); render(); toast(`${l.n} is open`); break; }
    case 'buykit': { const c = KIT_COST[S.kit]; if (S.coins < c) { toast(`Need ${num(c - S.coins)} more coins`); break; } S.coins -= c; S.kit++; save(); render(); toast('Field kit upgraded'); break; }
    case 'claimquest': { ensureDaily(); const entry = S.quests.list.find(q => q.id === d.id); if (!entry || entry.claimed) break; const {Q, val} = questProgress(d.id); if (val < Q.goal) break; entry.claimed = true; S.coins += Q.reward.coins || 0; S.dp += Q.reward.dp || 0; save(); render(); toast('Quest reward claimed'); break; }
    case 'setpartner': { if (!S.sp[d.id]) break; S.partner = S.partner === d.id ? null : d.id; save(); render(); toast(S.partner ? 'Partner set' : 'Partner removed'); break; }
    case 'resetarm': ui.reset = true; render(); break;
    case 'setbg': { if (!BG_OPTS[d.id]) break; S.bg = d.id; save(); render(); toast(`${BG_OPTS[d.id].n} applied`); break; }
    case 'resetdo': S = def(); save(); ui.reset = false; go('home'); toast('Progress erased'); break;
  }
});
render();
preloadAssets();
})();
</script>
</body>
